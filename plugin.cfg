[AUTHOR]
NAME=Anker SOLIX Plugin Authors
EMAIL=ankersolix@users.noreply.github.com

[PLUGIN]
VERSION=0.9.7
NAME=ankersolix
FOLDER=ankersolix
TITLE=Anker SOLIX

[AUTOUPDATE]
# Selbstaktualisierung ueber das eigene Repository. Die Adressen zeigen
# ausdruecklich NICHT auf ein fremdes Repository - sonst boete LoxBerry
# irgendwann ein Downgrade auf einen fremden Stand an (Hausregel, belegt am
# Docker-Plugin).
#
# Der Zweigname muss der Standardzweig des Repositories sein. Hier ist das
# 'main'; steht dort einmal etwas anderes, laeuft die Selbstaktualisierung
# ins Leere, ohne dass es jemand merkt - LoxBerry meldet dann schlicht nie
# eine neue Fassung.
#
# Die Fassung steht auf 0.9.7 und damit auf demselben Stand wie release.cfg:
# solange nicht an echter Gegenstelle erprobt, wird niemandem ein Update
# angeboten. Sobald 1.0.0 erscheint, greift die Aktualisierung von selbst.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-AnkerSolix/main/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-AnkerSolix/main/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
ARCHITECTURE=false
