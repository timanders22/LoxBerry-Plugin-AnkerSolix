[AUTOUPDATE]
# Solange keine eigene Vorabfassung gepflegt wird, steht hier dieselbe Fassung
# und dieselben Adressen wie in der release.cfg. Eine prerelease.cfg ohne
# VERSION-Zeile waere der schlechteste Fall: wird sie doch einmal abgerufen,
# ist das Verhalten undefiniert.
#
# Wie die release.cfg bleibt auch diese Datei bis nach dem Tag auf der
# VEROEFFENTLICHTEN Nummer stehen - welche Fassung im Arbeitsordner fertig
# liegt, sagt die plugin.cfg. Hier stand bis 11.09.2026 eine feste Zahl
# (0.9.6), die seit sieben Fassungen falsch war.

VERSION=0.9.15
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-AnkerSolix/archive/refs/tags/v0.9.15.zip
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-AnkerSolix/releases/tag/v0.9.15
