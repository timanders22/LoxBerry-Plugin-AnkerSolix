KONTO_ERKLAERUNG = "<b>Anker SOLIX has no local interface.</b> Neither the solarbank nor the smart meter answer requests from the home network; every value goes through the Anker cloud. This plugin therefore signs in with your Anker credentials. They are kept in a separate file with mode 0600, not in the configuration shown on this page, and they never appear in the Loxone project file. Since July 2025 the same account may be signed in on the app and further clients at the same time — a second account is no longer needed."
