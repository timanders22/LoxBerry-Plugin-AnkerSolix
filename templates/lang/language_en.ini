VORLAGE_TOKEN_WARNUNG = "<b>The generated files contain the action token in clear text.</b> Passing them on means passing on access to the system. Loxone Config <b>creates new</b> on import and overwrites nothing — read in twice you get duplicate blocks."
VON_HINWEIS = "Every set point address carries <span class='sm-mono'>&amp;von=loxone</span>. This is how the writer watch (<i>Settings</i> tab) tells the Miniserver apart from other writers; known identifiers of the other house plugins are <span class='sm-mono'>einspeisebremse</span>, <span class='sm-mono'>awattar</span> and <span class='sm-mono'>evcc</span>. An older template without it keeps working and appears in the <i>Test</i> tab as <i>without identifier</i>. <b>Existing integration:</b> append <span class='sm-mono'>&amp;von=loxone</span> to the existing commands of the virtual output instead of importing again - a new import creates the blocks twice."
