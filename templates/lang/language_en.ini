[BAUSTEIN]
SO_TITEL = "How to take over this page"
B_S2 = "Create virtual inputs, all with “Use in visualisation”: “Netzleistung (eigene Quelle)” analog, unit W, min -30000, max 30000 (no. 4); switches “Hauslast-Regelung ein” (no. 5) and “EVCC-Vorrang ein” (no. 38); push buttons “Eigenverbrauch”, “Smart einschalten” and “Anker jetzt abrufen” (no. 17, 20, 26); sliders “Einspeisegrenze (W)” min 0, max 800, step 10 (no. 22) and “Entladegrenze (Proz)” min 0, max 100, step 5 (no. 24)."
B_S3 = "Connect “Netzleistung (eigene Quelle)” with your own electricity meter: in your own project put the meter value in its place, i.e. at no. 9 (I2) and no. 28 (V3) – power in W, plus = import, minus = export, e.g. <span class='sm-mono'>smartmeter_0001_Total_Power_OBIS_16.7.0</span> from the plugin Smartmeter. Without this value nothing is controlled."
B_S5 = "In the plugin, tab <i>%s</i>: tick <i>%s</i>; leave <i>%s</i> at 0 (fallback off)."
B_S6 = "After saving, set both sliders once to their start value in the app (grid export limit 800 W, discharge limit 10) – Loxone only sends on a change. Then switch “Hauslast-Regelung ein” on."
H_TITEL = "Notes"
H_STATUS = "Status: the first row that applies wins; the row without condition is at the bottom."
H_ODER = "All faults run through OR into one notification; a notification block gets only one source."
H_VERZ = "The on-delay only reports when the fault persists – short dropouts of the cloud stay silent."
H_LEER = "“Speicher fast leer” switches on below 10&nbsp;% and off again above 15&nbsp;%."
H_TASTEN = "Release feed-in and block feed-in are push buttons in the app and send the commands “Anker: Netzeinspeisung freigeben” or “… sperren”; they only work with the ticks “Accept commands via MQTT” and “Allow write commands”."
H_EINMAL = "An output command may only be inserted once in Loxone: Netzeinspeisung freigeben and sperren are only on page “AnkerSolix”, the other commands only on “AnkerSolix Steuerung”. Inputs such as ankersolix_status_ok may be on both pages."
H_SCHREIBBREMSE = "Write brake: by default the plugin accepts at most one write command every 10 s. That is why no. 12 waits 15 s after the mode change. If a slider is moved shortly after a control value and rejected (acknowledgement at …/quittung), move it once more."
H_GLEICH = "An equal value is only sent on a change: Loxone sends an output command only when the value changes. If the same value comes within 60 s anyway, the plugin acknowledges it as accepted without asking the cloud – that also holds off the fallback."
H_RUECKFALL = "Leave the fallback in the plugin off (off by default): Loxone only sends changes, an unchanged value would trigger it otherwise. Anker has no watchdog – if the Miniserver fails, the last house load stays in force; the push button “Eigenverbrauch” hands control back to the Solarbank."
H_PROZENT = "Percentages are written as ‘(pct)’ in names, because Config turns ‘%’ into ‘_’ – hence the command is called Set discharge limit (pct). If you imported the control template earlier, the two commands are still called ‘… (_)’ in Config: import the template again or rename the commands."
S1_SCHRITT1 = "Set up values via MQTT: in the plugin, tab MQTT, “Publish values via MQTT” (on by default). In the MQTT gateway (version 2) tick the entries of the list in tab MQTT, for <span class='sm-mono'>ankersolix_status_ok</span> also “Noncached”. Section “%s” above names every name with a copy button."
S1_SCHRITT2 = "Create a page “AnkerSolix”. The gateway creates the virtual inputs no. 1–6, 17–24, 31–36, 38–41 and 45 with the names of the table (Periphery → Virtual inputs); drag them onto the page. No. 30 is another instance of no. 1. Do not tick “Use as digital input”; the LoxBerry user needs rights on each of these inputs in Loxone."
S1_SCHRITT3 = "At the output “LoxBerry MQTT-Gateway” (virtual output, address <span class='sm-mono'>/dev/udp/&lt;LoxBerry&gt;/11884</span>) create the commands no. 16 and 29 – command on ON as in the table, never “retain” – or import the template <span class='sm-mono'>VQ_ankersolix_steuern.xml</span> (button above)."
S1_SCHRITT4 = "Place two virtual inputs as push buttons (no. 15 and 28), two notifications (no. 9 and 14), the constant (no. 46, another instance) and the remaining blocks – status, threshold switch, NOT, OR, AND, on delay, analog value validation, formula and meter for storage – and enter the parameters from the table. For the analog value validation (no. 47) remove the tick at “En”."
S1_SCHRITT5 = "Draw the connections according to the column “Connect inputs to”."
S1_SCHRITT6 = "In the plugin, tab <i>%s</i>: tick <i>%s</i>, in tab MQTT <i>%s</i> – otherwise no. 16 and 29 do nothing. For the forecast (no. 24) remove the tick <i>%s</i>."
S2_SCHRITT1 = "Create a second page “AnkerSolix Steuerung”. Drag the inputs no. 1–3 onto the page a second time, the EVCC inputs no. 29–31 (plugin EVCC, prefix evcc2lox by default) as another instance from page “EVCC”. Create the seven commands no. 11, 16, 19, 21, 23, 25 and 27 at the output “LoxBerry MQTT-Gateway” (or from <span class='sm-mono'>VQ_ankersolix_steuern.xml</span>)."
S2_SCHRITT4 = "Place the remaining blocks – threshold switch, AND, OR, formula, edge detection, on and off delay, pulse generator, analog memory, analog value validation, constant and status –, enter the parameters from the table (no. 36: remove the tick at “En”; no. 37, 46 and 47: input I2 negated) and draw the connections according to the column “Connect inputs to”. No notification: the page “AnkerSolix” reports faults."
S2_SCHRITT7 = "EVCC priority (no. 29–48): off by default (switch no. 38). Only switch it on with the EVCC plugin via MQTT and a charging point. When the car charges from the grid for at least 60 s, the page puts the Solarbank into manual mode with house load 0 W and back afterwards."
H_LEBEN = "Sign of life: no. 45 counts on every minute, even when the cloud is silent. If the value stands still for 5 minutes, no. 47 reports – then LoxBerry, the MQTT gateway or the service is down, or MQTT is off in the plugin. So that Loxone has the values right after a restart, send reconnect to the gateway at system start in the sample project (page “LoxBerry MQTT-Gateway”)."
H_MODUS = "For Solarbank 2 and 3 the house load only works in mode manual (or smart plugs). That is why no. 11 sends “Betriebsart Manuell” first and no. 12 waits 15 s – the plugin rejects a house load in any other mode and says why."
H_EVCC = "EVCC priority: when the car charges from the grid via EVCC, the Solarbank does not give its storage to the car (manual, house load 0 W). If EVCC is silent (no. 36), nothing holds; a running hold ends after 120 s. Whether the Solarbank really delivers 0 W at 0 W or its minimum load is not measured on a device."
