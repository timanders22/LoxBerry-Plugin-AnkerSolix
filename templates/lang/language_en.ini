SO_TITEL = "How to take over this page"
A_S1 = "Import the templates: press the buttons <i>%s</i>, <i>%s</i> and <i>%s</i> in step 9 above and import the three files in Loxone Config (Periphery → Virtual inputs or Virtual outputs → Import template). Import each file only once."
A_S2 = "Create a page “AnkerSolix” and drag the inputs and commands of the table from the periphery tree onto the page: no. 1–6 and 17–24 from “%s”, no. 30–36 and 38–41 from “%s”, no. 16 and 29 from “%s”."
A_S3 = "Create two virtual inputs (Periphery → Virtual inputs), input type push button, “Use in visualisation” on: “Einspeisung freigeben” (no. 15) and “Einspeisung sperren” (no. 28)."
A_S4 = "Create two notifications (Periphery → Messages → Notification) and drag them onto the page (no. 9 and 14). Then place the other blocks – Status, Threshold switch, NOT, OR, On-delay, Formula and Meter for storage (category Energy) – and enter the parameters from the table."
A_S5 = "Draw the connections as listed in the column “Connect inputs with”."
A_S6 = "In the plugin, tab <i>%s</i>: tick <i>%s</i> – otherwise no. 16 and 29 have no effect. For the forecast (no. 24) remove the tick <i>%s</i>."
B_S1 = "Create a second page “AnkerSolix Steuerung”. No new template: drag the inputs no. 1–3 from “%s” onto the page a second time, and the seven commands no. 11, 16, 19, 21, 23, 25 and 27 from “%s”."
B_S2 = "Create virtual inputs, all with “Use in visualisation”: “Netzleistung (eigene Quelle)” analog, unit W, Min -30000, Max 30000 (no. 4); switch “Hauslast-Regelung ein” (no. 5); push buttons “Eigenverbrauch”, “Smart einschalten” and “Anker jetzt abrufen” (no. 17, 20, 26); sliders “Einspeisegrenze (W)” Min 0, Max 800, step 10 (no. 22) and “Entladegrenze (Proz)” Min 0, Max 100, step 5 (no. 24)."
B_S3 = "Connect “Netzleistung (eigene Quelle)” with your own electricity meter: in your own project put the meter value in its place, i.e. at no. 9 (I2) and no. 28 (V3) – power in W, plus = import, minus = export, e.g. <span class='sm-mono'>smartmeter_0001_Total_Power_OBIS_16.7.0</span> from the plugin Smartmeter. Without this value nothing is controlled."
B_S4 = "Place the other blocks – Threshold switch, three AND, OR, Formula, Edge detection, On-delay, Pulse generator, Analog memory and Status –, enter the parameters from the table and draw the connections as listed in the column “Connect inputs with”. No notification: faults are reported by the page “AnkerSolix”."
B_S5 = "In the plugin, tab <i>%s</i>: tick <i>%s</i>; leave <i>%s</i> at 0 (fallback off)."
B_S6 = "After saving, set both sliders once to their start value in the app (grid export limit 800 W, discharge limit 10) – Loxone only sends on a change. Then switch “Hauslast-Regelung ein” on."
H_TITEL = "Notes"
H_STATUS = "Status: the first row that applies wins; the row without condition is at the bottom."
H_ODER = "All faults run through OR into one notification; a notification block gets only one source."
H_VERZ = "The on-delay only reports when the fault persists – short dropouts of the cloud stay silent."
H_LEER = "“Speicher fast leer” switches on below 10&nbsp;% and off again above 15&nbsp;%."
H_TASTEN = "“Einspeisung freigeben” and “Einspeisung sperren” are push buttons in the app and send the commands release or block grid export; they only work with write commands allowed."
H_EINMAL = "An output command may only be inserted once in Loxone: release and block grid export are only on the page “AnkerSolix”, the other commands only on “AnkerSolix Steuerung”. Inputs such as ANKER_1_OK, however, may be on both pages."
H_SCHREIBBREMSE = "Write brake: by default the plugin accepts at most one write command every 10 s. That is why no. 12 waits 15 s after the mode change. If a slider moved shortly after a control value is rejected, move it again."
H_GLEICH = "An unchanged value is only sent on a change: Loxone sends an output command only when the value changes. If the control is switched on again with exactly the same wish, set house load only goes out with the next change; operating mode manual goes out at once."
H_RUECKFALL = "Leave the fallback in the plugin off (off by default): Loxone only sends changes, an unchanged value would trigger it otherwise. Anker has no watchdog – if the Miniserver fails, the last house load stays in force; the push button “Eigenverbrauch” hands control back to the Solarbank."
H_PROZENT = "Percentages are written as ‘(pct)’ in names, because Config turns ‘%’ into ‘_’ – hence the command is called Set discharge limit (pct). If you imported the control template earlier, the two commands are still called ‘… (_)’ in Config: import the template again or rename the commands."

