ABO_GEMESSEN = "(measured: gateway&nbsp;V%d)"
ABO_SCHRITTE = "The topic group of this plugin is:"
ABO_UNBEKANNT = "The version of your MQTT gateway could not be determined. <b>Version&nbsp;1:</b> without this entry nothing arrives at the Miniserver; the line belongs under <i>System → MQTT Gateway</i> in the <i>Subscriptions</i> section. <b>Version&nbsp;2 and newer:</b> the topic group appears by itself under Subscriptions, nothing needs to be entered."
ABO_V2 = "<b>MQTT&#8209;Gateway V2 recognises the topic group by itself</b> — nothing has to be entered here. The group appears in the <i>Subscriptions</i>; there the desired data points are ticked one by one (the list for the sample project is in tab MQTT). If it does not appear, nothing has been published yet."
ABO_WARNUNG = "<b>Without this entry nothing arrives at the Miniserver.</b> This is the single most common cause of failure. The line belongs under <i>System → MQTT Gateway</i> in the <i>Subscriptions</i> section; save afterwards."
AUTOSTART_AUS = "The gateway is <b>not</b> set to autostart. Messages are sent but nobody is listening. Remedy: <i>System → MQTT Gateway</i>, switch autostart on."
AUTOSTART_EIN = "The gateway is set to autostart."
GATEWAY_ERKLAERUNG = "Since LoxBerry 3 the MQTT gateway is <b>part of the system</b>, not a plugin. It is not installed separately but switched on under <i>System → MQTT Gateway</i>. A note for troubleshooting: the broker host defaults to <span class='sm-mono'>localhost</span>. The fact that something is entered there does not mean messages can arrive — what matters is the autostart setting."
H_ABO = "The subscription in the MQTT gateway"
H_THEMEN = "Published topics"
H_ZUSTAND = "State of the gateway"
NICHT_GEFUNDEN = "No MQTT section can be found in the LoxBerry <span class='sm-mono'>general.json</span>. Please open <i>System → MQTT Gateway</i> once and save."
PLATZHALTER = "<span class='sm-mono'>N</span> is the number of the system (1, 2, ...), <span class='sm-mono'>&lt;SN&gt;</span> the serial number of the device. The mapping is shown in the Settings tab."
THEMEN_ERKLAERUNG = "The service publishes after every poll, the sign of life <span class='sm-mono'>status/*</span> fixed every minute. If a value is missing in the answer of the cloud, since 0.9.32 the value without a statement goes out (column on the right: -1 for numbers, a dash for texts) – never an invented zero, and no old value remains. If status/ok drops to 0, the readings go out once as -1. The column <i>retained</i> says whether the broker keeps the last value: this applies to states and settings. Readings and the sign of life are never retained. When switching off, with a new prefix and on uninstall the plugin clears the retained topics at the broker and reads back."
RETAINED_UNBEKANNT = "unknown — the table in the service cannot be read"
TS_HINWEIS = "<b>Via MQTT there is no “age” in the value itself</b> – hence the sign of life: <span class='sm-mono'>status/zaehler</span> counts on every minute, <span class='sm-mono'>status/alter</span> gives the seconds since the last successful poll and keeps growing even when the cloud is silent, <span class='sm-mono'>status/ok</span> drops to 0 after three cycles without success. If the counter stands still, the service, the gateway or LoxBerry is down. <span class='sm-mono'>ok</span>, <span class='sm-mono'>ts</span> and <span class='sm-mono'>fehler</span> at the root continue for one more version and are dropped then."
