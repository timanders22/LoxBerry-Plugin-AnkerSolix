NICHT_GEFUNDEN = "No MQTT section can be found in the LoxBerry <span class='sm-mono'>general.json</span>. Please open <i>System → MQTT Gateway</i> once and save."
PLATZHALTER = "<span class='sm-mono'>N</span> is the number of the system (1, 2, ...), <span class='sm-mono'>&lt;SN&gt;</span> the serial number of the device. The mapping is shown in the Settings tab."
THEMEN_ERKLAERUNG = "The service publishes on every poll. If a value is missing from the cloud response nothing is sent for that topic — instead of an invented zero. The column <i>retained</i> tells whether the broker keeps the last value: this applies to states and settings, so that Loxone has them again at once after a restart of the broker, the gateway or the Miniserver. Measurements, <span class='sm-mono'>ok</span>, <span class='sm-mono'>ts</span> and <span class='sm-mono'>fehler</span> are never retained, so that no old value appears fresh. Uninstalling deletes the retained topics again."
RETAINED_UNBEKANNT = "unknown — the table in the service cannot be read"
TS_HINWEIS = "<b>Over MQTT there is no „age“:</b> at the moment of sending it is always zero. That is why <span class='sm-mono'>ts</span> is published — the time of the last <i>successful</i> poll — and the receiver does the arithmetic. Without it a dead service cannot be told from a healthy one: nothing is sent any more, the virtual inputs in Loxone keep their last value, and the retained states stay in the broker. That is why <span class='sm-mono'>ts</span> itself is never retained."
