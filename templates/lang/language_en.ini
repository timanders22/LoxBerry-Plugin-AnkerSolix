VORLAGE_TOKEN_WARNUNG = "<b>The generated files contain the action token in clear text.</b> Passing them on means passing on access to the system. Loxone Config <b>creates new</b> on import and overwrites nothing — read in twice you get duplicate blocks."
VON_HINWEIS = "Every set point address carries <span class='sm-mono'>&amp;von=loxone</span>. This is how the writer watch (<i>Settings</i> tab) tells the Miniserver apart from other writers; known identifiers of the other house plugins are <span class='sm-mono'>einspeisebremse</span>, <span class='sm-mono'>awattar</span> and <span class='sm-mono'>evcc</span>. An older template without it keeps working and appears in the <i>Test</i> tab as <i>without identifier</i>. <b>Existing integration:</b> append <span class='sm-mono'>&amp;von=loxone</span> to the existing commands of the virtual output instead of importing again - a new import creates the blocks twice."
BL_WERTE = "Values, messages and balance"
BL_STEUERUNG = "House load control and settings"
BILD_ALT = "Plugin blocks in Loxone Config – %s"
BILD_UNTERSCHRIFT = "Page “%s” in the LoxBerry plugins sample project. Config shortens long block names – see the table for the full names."
MUSTERPROJEKT = "The complete project file with all plugin pages and templates: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry plugins sample project</a>"
W_TITEL = "Step 2: Values via MQTT"
W_TEXT = "The plugin sends its values via the UDP input of the MQTT gateway; the gateway creates one virtual input per value in Loxone with this name. The table lists all names – with copy button, meaning, value range and the value without a statement (-1 for numbers, a dash for texts)."
W_RECHTE = "The LoxBerry user needs rights on each of these inputs in Loxone. Do NOT tick “Use as digital input”. Error value -1 means: no statement – evaluate status_ok as well."
W_RECONNECT = "At system start of the Miniserver send reconnect to the gateway (page “LoxBerry MQTT-Gateway” in the sample project) – otherwise an unchanged value only arrives with the next change."
W_SN = "Device topics carry the serial number in the name. It is shown only here in the logged-in area; whoever passes names on replaces it with &lt;SN&gt;."
W_EVCC = "For the EVCC priority the page “AnkerSolix Steuerung” needs three values of the EVCC plugin (provider EVCC, prefix evcc2lox by default; the ticks are set in the gateway):"
EVCC_LAEDT = "1 = charging point 1 is charging, -1 = EVCC delivers no charging point"
EVCC_NETZ = "grid power in kW, plus = import"
EVCC_ZAEHLER = "sign of life of the EVCC plugin (every 30 s)"
K_KOPIEREN = "copy"
B_TITEL = "Step 3: Commands via MQTT (command bridge)"
B_TEXT = "In the plugin tick “Accept commands via MQTT” in tab MQTT and “Allow write commands” in tab Settings (both off by default). In Loxone create one <i>virtual output command</i> per command at the output “LoxBerry MQTT-Gateway”; never “retain”. Sites 2 to 9: <span class='sm-mono'>…/befehl/&lt;nr&gt;/&lt;command&gt;</span>. The inverter limit (pvlimit) stays on the HTTP path: it needs the serial number."
B_HAUSLAST_MODUS = "<b>For Solarbank 2 and 3 the house load only works in mode manual (or smart plugs).</b> First “modus manuell”, then the house load – otherwise the plugin rejects and says why (acknowledgement “abgelehnt: MODUS_1: …”)."
B_AUSGANG = "Virtual output “LoxBerry MQTT-Gateway”, address <span class='sm-mono'>/dev/udp/%s/%d</span>; per command “command on ON” or on analog value as in column Loxone."
T_B_NAME = "Topic"
