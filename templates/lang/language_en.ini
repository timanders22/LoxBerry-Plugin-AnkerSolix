FEHLER_GRENZE_TAUSCH = "For system %s the lower limit is greater than the upper one."
FEHLER_HAUSLAST_TAUSCH = "The lowest permitted house load is greater than the highest. Please swap the two values."
FEHLER_LAND = "The country code must consist of exactly two letters, for example DE."
FEHLER_RUECKFALL_MODUS = "The operating mode for the fallback is unknown."
FEHLER_SPEICHERN = "The configuration could not be written: %s"
FEHLER_TOPIC = "The topic prefix may only contain letters, digits, hyphen, underscore and slash, may be at most 64 characters long, must not begin or end with a slash, must not contain two slashes in a row and must not be empty. Nothing has been changed."
FEHLER_ZAHL = "%s: please enter a whole number."
FEHLER_ZUGANG_SPEICHERN = "The credentials could not be saved. Please check the permissions of the configuration folder."
EINGABEN_ZURUECK = "Nothing was taken over, neither saved nor sent. Your entries are back in the form, the rejected field is outlined in red. A typed password is not returned for security reasons - please enter it again."
GESPEICHERT = "The settings have been saved, including a backup copy for updates."
H_ABLAGE = "Recording"
H_ANFRAGE_FRIST = "After this time a request counts as failed. Without a timeout a poll left open by the far end can stall the service for good — and the one-minute watchdog will not restart it, because the process is still alive."
H_ANFRAGE_PAUSE = "The library default is 3, i.e. 0.3 s. Increase it if the cloud answers with 429."
H_DIENST = "Polling service"
H_EMAIL = "The same address you use to sign in to the Anker app."
H_ENDPUNKT_LIMIT = "Passed on to the library if it supports it. 10 matches the observed limit."
H_ENERGIE_TAGE = "Monthly and yearly totals and the continuous meter readings are built from these daily values. 400 days cover a full year plus a comparison with the year before; the file stays below 30 kB per system."
H_ERKANNT = "Detected devices"
H_GRENZEN_ANLAGE = "Limits per system"
H_GRENZEN_ANLAGE_TEXT = "One shared maximum for a Solarbank E1600 and a Solarbank 3 is either too small or too large. An empty field means: the general value above applies — not 0."
H_HAUSLAST = "Values outside these bounds are rejected and reported, not silently clipped. Enter what your device can do: Solarbank 2 and 3 usually go up to 800 W, and higher in countries without the 800 W cap. The figure is shown in the Anker app when setting the output power."
H_INTERVALL = "60 seconds is the sensible default. The device refreshes the cloud at most once a minute, in some cases only every five minutes — a shorter interval therefore yields no fresher values, only more requests."
H_KONTO = "Anker account"
H_LAND = "Two letters, for example <span class='sm-mono'>DE</span> or <span class='sm-mono'>AT</span>. This is the country the Anker account was created with — not the display language."
H_MELDEN = "Notifications"
H_MELDEN_ALTER = "A single miss is no reason. 900 s means: only after a quarter of an hour without a successful poll."
H_MELDEN_EIN = "Without this nobody learns about a fault: the service would keep running for days against rejections, and you would only notice when opening this page."
H_MQTT = "Publishing"
H_MQTT_AENDERUNG = "Saves messages. <span class='sm-mono'>ok</span>, <span class='sm-mono'>ts</span> and <span class='sm-mono'>fehler</span> still go out every cycle — publishing on change alone simply stops during a fault, and in Loxone a dead service then looks like a quiet house. In addition the full set goes out every 30 minutes, so that a datagram lost on the way is not missing until the next change."
H_MQTT_TOPIC = "Every topic starts with this. The MQTT tab lists exactly what is published."
H_OHNE_PROGNOSE = "Off by default. The forecast costs one request per system and hour; in return it gives the remaining yield of the day — the single most useful figure for a control loop in Loxone."
H_PASSWORT = "If left empty the stored password is kept. It is never displayed — the Test tab only states its length."
H_RUECKFALL_MIN = "Anker has <b>no watchdog</b>: a setpoint stays put even if Loxone fails. If no valid setpoint arrives from Loxone for this long, the plugin resets the operating mode itself. An unchanged setpoint that the plugin does not resend (same value within 60 s, step size) counts too; commands from the Test tab only count when they are sent. <b>0 switches this off</b> — and off is the factory setting, because it is an intervention that happens without you."
H_SCHREIBBREMSE = "A control loop in Loxone sending a new setpoint every second runs straight into the cloud’s 429 block. A discarded command is <b>reported</b>, not silently swallowed. 0 disables the brake."
H_SCHRITTWEITE = "A change of a few watts costs a cloud request and does nothing at the device. Smaller steps are not sent; the answer is still OK=1, with UNVERAENDERT=1 and the reason. 0 disables the check."
H_SICHERUNG = "Back up and restore settings"
H_STEUERUNG = "Write commands"
H_TAKT = "Polling interval"
H_TAKT_DETAILS = "Settings, firmware and equipment rarely change. At a 60 s interval, 10 cycles means every ten minutes."
H_TAKT_ENERGIE = "The energy statistics query is the most expensive one. Anker throttles this endpoint to about ten to twelve requests per minute; beyond that it answers HTTP 429. 15 cycles is a calm setting."
H_TAKT_PROGNOSE = "The library allows at most one refresh per hour, so 60 is the smallest sensible value."
H_UMFANG = "Poll scope"
H_VERLAUF_TAGE = "The readings behind the daily chart. The service removes older files by itself."
H_WARTEZEIT = "This is how long the Miniserver endpoint waits for the result of a command. If nothing arrives it answers <span class='sm-mono'>OK=2</span> — queued, result unknown. It never reports a success nobody verified."
H_WEG = "The <b>command path</b> states which library call would reach this device — it depends on the device generation. Anyone testing this version can classify a finding without reading the source. The <b>discharge limits</b> are queried from the device once a day; a dash means no answer has arrived yet."
H_ZAEHLER_EIN = "The cloud only reports the daily figure, and at midnight it drops back to 0. Loxone prefers continuous meter readings; the plugin builds them from the daily totals. They can only rise — a daily value corrected afterwards is never subtracted."
