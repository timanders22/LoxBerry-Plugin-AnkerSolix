H_STEUERUNG = "Write commands"
H_TAKT = "Polling interval"
H_TAKT_DETAILS = "Settings, firmware and equipment rarely change. At a 60 s interval, 10 cycles means every ten minutes."
H_TAKT_ENERGIE = "The energy statistics query is the most expensive one. Anker throttles this endpoint to about ten to twelve requests per minute; beyond that it answers HTTP 429. 15 cycles is a calm setting."
H_TAKT_PROGNOSE = "The library allows at most one refresh per hour, so 60 is the smallest sensible value."
H_UMFANG = "Poll scope"
H_VERLAUF_TAGE = "The readings behind the daily chart. The service removes older files by itself."
H_WARTEZEIT = "This is how long the Miniserver endpoint waits for the result of a command. If nothing arrives it answers <span class='sm-mono'>OK=2</span> — queued, result unknown. It never reports a success nobody verified."
H_WEG = "The <b>command path</b> states which library call would reach this device — it depends on the device generation. Anyone testing this version can classify a finding without reading the source. The <b>discharge limits</b> are queried from the device once a day; a dash means no answer has arrived yet."
H_ZAEHLER_EIN = "The cloud only reports the daily figure, and at midnight it drops back to 0. Loxone prefers continuous meter readings; the plugin builds them from the daily totals. They can only rise — a daily value corrected afterwards is never subtracted."
KEINE_GERAETE = "No devices are known yet. That is normal as long as the service has not run or the sign-in did not work. The Test tab will tell you why."
KONTO_ERKLAERUNG = "<b>Anker SOLIX has no local interface.</b> Neither the solarbank nor the smart meter answer requests from the home network; every value goes through the Anker cloud. This plugin therefore signs in with your Anker credentials. They are kept in a separate file with mode 0600, not in the configuration shown on this page, and they never appear in the Loxone project file. Since July 2025 the same account may be signed in on the app and further clients at the same time — a second account is no longer needed."
