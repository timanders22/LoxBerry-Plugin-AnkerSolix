DIENST_ERKLAERUNG = "The service fetches the values from the Anker cloud at the configured interval and stores them. The user interface and the Miniserver only read that cache — they never talk to the cloud themselves. A watchdog running every minute restarts the service if it crashes; a service stopped by hand stays stopped."
