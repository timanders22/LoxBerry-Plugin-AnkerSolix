T_B_LOXONE = "Loxone (command on ON)"
T_B_SPERRE = "Repeat lock"
B_QUITTUNG = "The answer is at <span class='sm-mono'>…/quittung</span> (accepted or rejected with reason, never retained); the sign of life of the bridge is <span class='sm-mono'>%s</span>. Repeat lock 0 for the setpoints: the plugin itself catches equal values (counted as accepted)."
K_VORLAGE_MQTT = "Create template commands (MQTT)"
B_VORLAGE = "The template <span class='sm-mono'>VQ_ankersolix_steuern.xml</span> creates an own virtual output “AnkerSolix steuern (MQTT)” with the commands of the table – without a token. Whoever uses the existing output “LoxBerry MQTT-Gateway” creates the commands there by hand."
ALT_TITEL = "Existing installations: HTTP endpoint"
ALT_TEXT = "Not needed for new installations: values via MQTT (name table above), commands via the bridge. The HTTP path remains for existing projects – the read branch (status, energie, geraet, anlagen, roh) only with this tick; the commands with token and the self test do not depend on it."
L_ENDPUNKT = "Accept the HTTP read branch for Loxone"
