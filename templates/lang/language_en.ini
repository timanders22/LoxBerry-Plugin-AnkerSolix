H_WACHE_TEXT = "For each system, the endpoint remembers who sends set points: the identifier from <span class='sm-mono'>&amp;von=</span> (the template sets <span class='sm-mono'>von=loxone</span>) and the sender address. If several writers send commands to the same system within the time window, this is shown in the log, in the <i>Test</i> tab and in the response as <span class='sm-mono'>;SCHREIBER=n</span>. Nothing is rejected because of it."
L_WACHE_EIN = "Report several writers (log, Test tab)"
