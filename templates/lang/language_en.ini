WAS_IST_DAS = "<b>Anker SOLIX on the Loxone Miniserver.</b> The plugin reads Solarbank, Smart Meter, inverters, smart plugs and power stations. Anker offers no local interface, so a polling service fetches the values from the Anker cloud with the stored credentials at the configured interval. The values reach the Miniserver over MQTT and over a token-protected HTTP endpoint; once enabled, the plugin also accepts setpoints and operating modes there and passes them on to the cloud."

