L_WACHE_SPERREN = "Reject foreign writers (HTTP 409)"
H_WACHE_SPERREN = "<b>Off by default.</b> Only switch it on when the <i>Test</i> tab has shown only the expected writers for a week. Then every set point from a writer that is not in the list gets HTTP 409 <span class='sm-mono'>GRUND=FREMDSCHREIBER</span>, and nothing is queued. The withdrawal <span class='sm-mono'>modus=eigenverbrauch</span> (the Solarbank regulates itself again by the smart meter) is never rejected. Note: a Loxone template without <span class='sm-mono'>von=loxone</span> appears as <i>without identifier</i> and would be locked out by the list <span class='sm-mono'>loxone</span> - then add the address of the Miniserver as well."
L_WACHE_ERLAUBT = "Allowed writers"
