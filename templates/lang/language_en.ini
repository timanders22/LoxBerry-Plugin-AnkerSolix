EINLEITUNG = "Loxone is the energy manager: the plugin supplies the readings, the Miniserver decides. Since 0.9.32 values and commands go via the MQTT gateway – without a token in the project file. The HTTP endpoint remains for existing installations (below, “Existing installations: HTTP endpoint”)."
H_TITEL = "Loxone integration, step by step"
KEIN_ZIP = "The bundle needs the PHP extension <span class='sm-mono'>zip</span>. It is not listed in <span class='sm-mono'>dpkg/apt</span> and therefore not guaranteed. The individual templates below still work."
K_ERZEUGEN = "generate"
K_TOKEN_NEU = "Generate new token"
K_VORLAGE = "Generate template for live values"
K_VORLAGE_ALLES = "Create everything at once (ZIP)"
K_VORLAGE_AUSGANG = "Generate template for the control commands"
K_VORLAGE_ENERGIE = "Generate template for energy values"
MEHRERE_ANLAGEN = "Several systems: one address per system, and name the titles with the system number accordingly."
S10_TEXT = "Two pages from the LoxBerry plugins sample project, built and connected there in Loxone Config: first values, messages and balance, below that the house load control with the settings from the app. Work through a table from top to bottom and you have rebuilt the page. Loxone Config lists every block in the block search (F5)."
S10_TITEL = "Step 5: Complete block lists to rebuild"
S11_TEXT = "Call these four addresses in the browser. The first checks the token <b>without anything happening</b> — that is exactly what it is for. The read branch (second line) only answers with the tick “Accept the HTTP read branch for Loxone”."
S11_TITEL = "Step 6: Cross-check"
S1_TEXT = "<b>MQTT is the standard route</b> – for values and, with the tick “Accept commands via MQTT”, also for commands. The gateway creates the names of the virtual inputs itself; in Loxone a suitably named virtual input is then enough. The HTTP route remains for existing installations."
S1_TITEL = "Step 1: choose the route"
S2_WARNUNG = "<b>Without this entry nothing arrives at the Miniserver.</b> This is the single most common cause of failure."
S3_BEFEHLE = "Below it one <i>Virtual HTTP input command</i> per value. In the command recognition the search text goes between <span class='sm-mono'>\i...\i</span>, and <span class='sm-mono'>\v</span> picks up the number behind it."
S3_SEMIKOLON = "<b>The semicolon in front of the field name belongs in the pattern</b>, and it is mandatory. Loxone searches for the string literally and takes the first hit: without a leading semicolon <span class='sm-mono'>LADEN=</span> would also match inside <span class='sm-mono'>ENTLADEN=</span>. That it might work today would be down to the order in the line alone. A wrong value is worse than a missing one."
S3_STRICH = "<b>A dash instead of a number</b> means the cloud did not supply that field. No 0 is sent on purpose — a 0 would be a silent false statement. Loxone then keeps the last valid value. That is exactly why <span class='sm-mono'>ALTER</span> and <span class='sm-mono'>OK</span> should always be evaluated as well: without them a frozen value looks like a current one in the app."
S3_TEXT = "Whoever takes the HTTP route creates a <i>virtual HTTP input</i> with this address in Loxone Config (only with the tick above):"
S3_TITEL = "HTTP 1: Create virtual inputs for the power values"
S4_TEXT = "These values come from the Anker cloud energy statistics and change slowly. 300 seconds is enough; polling more often gains nothing because the service only refreshes them every few minutes anyway."
S4_TITEL = "HTTP 2: Virtual input for the daily energies"
S4_ZEITRAUM = "The same address with <span class='sm-mono'>&amp;zeitraum=monat</span> or <span class='sm-mono'>&amp;zeitraum=jahr</span> returns the totals of the current month or year instead of the daily values — <b>under the same field names</b>, so the same import template fits. The plugin builds those totals from its own daily record; the cloud only reports „today“."
S5_TEXT = "Besides the system, every recognised device can be queried on its own — storage, smart meter, inverter, plug. Worth it when several storages hang off one system, or when you want to watch the Wi-Fi quality of a single device."
S5_TITEL = "HTTP 3: Query single devices"
S6_MODI = "Permitted values for <span class='sm-mono'>wert=</span>: <span class='sm-mono'>eigenverbrauch</span>, <span class='sm-mono'>steckdosen</span>, <span class='sm-mono'>manuell</span>, <span class='sm-mono'>zeitplan</span>, <span class='sm-mono'>smart</span>, <span class='sm-mono'>zeitfenster</span> (Solarbank 3, plans with the tariff from the Anker app). Anything else is rejected and reported, not bent into shape. Operating modes only exist from Solarbank 2; Solarbank 1 only knows schedules. For Solarbank 2 and 3 the house load only works in mode manual (or smart plugs)."
S6_TEXT = "Only needed if Loxone is to control the storage system. Prerequisite: write commands are enabled in the Settings tab. Create a <i>Virtual output</i> with the address of the LoxBerry, and below it one <i>Virtual output command</i> per command; Loxone replaces <span class='sm-mono'>&lt;v&gt;</span> with the numeric value."
S6_TITEL = "HTTP 4: Send commands (virtual output with token)"
S6_UNGEPRUEFT = "<b>Grid export, export limit, backup reserve and the inverter limit are new in 0.9.7 and untested on any device.</b> They act through <span class='sm-mono'>set_station_parm</span> and <span class='sm-mono'>set_device_pv_power</span>. Whoever uses them should check in the Anker app afterwards that what is described here has actually happened."
S6_WARNUNG = "<b>These commands are untested.</b> They were derived from the library but never executed on a real system for lack of a device. Try them in the Test tab with the Anker app open alongside before building automation on them. Unlike the Marstek storage there is <b>no watchdog</b> here: a set point stays in force even if Loxone fails."
S7_TEXT = "If the cloud goes silent the virtual inputs keep their last value — and everything looks normal in the app. That is why <span class='sm-mono'>ALTER</span> is evaluated: it counts the seconds since the last successful poll. Set the threshold well above the polling interval so that a single missed run does not raise an alarm: at a 60 s interval, 300 s is a good value. As a side benefit <span class='sm-mono'>ALTER</span> avoids any time arithmetic — Loxone counts seconds since 2009-01-01, so a Unix timestamp would first have to be reduced by 1230768000. <span class='sm-mono'>OK</span> also drops to 0 by itself as soon as <span class='sm-mono'>ALTER</span> exceeds three times the polling interval (180 s at a 60 s interval) — a service that has stopped polling no longer reports 1."
S7_TITEL = "HTTP 5: Failure detection"
S8_TEXT = "The endpoint sits in the unauthenticated area so that Loxone can reach it without credentials. It is therefore protected by a token; without a matching token it answers HTTP 403. A new token invalidates every address already entered in the Miniserver — they have to be adjusted afterwards."
S8_TITEL = "Step 4: The token"
S9_TEXT = "Instead of creating every virtual input by hand: generate the ready-made import file and read it into Loxone Config. The tables above stay anyway — they explain what is being imported."
S9_TITEL = "HTTP 6: Templates for Loxone Config (HTTP route)"
