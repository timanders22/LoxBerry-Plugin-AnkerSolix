H_MQTT_TOPIC = "Every topic starts with this. The MQTT tab lists exactly what is published."
H_OHNE_PROGNOSE = "Off by default. The forecast costs one request per system and hour; in return it gives the remaining yield of the day — the single most useful figure for a control loop in Loxone."
H_PASSWORT = "If left empty the stored password is kept. It is never displayed — the Test tab only states its length."
H_RUECKFALL_MIN = "Anker has <b>no watchdog</b>: a setpoint stays put even if Loxone fails. If no write command arrives for this long, the plugin resets the operating mode itself. <b>0 switches this off</b> — and off is the factory setting, because it is an intervention that happens without you."
H_SCHREIBBREMSE = "A control loop in Loxone sending a new setpoint every second runs straight into the cloud’s 429 block. A discarded command is <b>reported</b>, not silently swallowed. 0 disables the brake."
