; Help texts, English. Belongs to templates/help/help.html.
; Same quoting rules as the German file: every value in double quotes,
; none inside, attributes in markup single-quoted.

[HILFE]
K01 = "Anker SOLIX"
K02 = "Connects Anker SOLIX devices to Loxone: Solarbank E1600 (gen 1), Solarbank 2 (Plus, Pro, AC), Solarbank 3 E2700, smart meter, MI80 inverter, smart plugs, power stations, Power Panel and X1."
K03 = "Why through the cloud?"
K04 = "Anker SOLIX has <b>no local interface.</b> Neither the Solarbank nor the smart meter answer requests from the home network; every value goes through the Anker cloud. That is why the plugin needs your Anker credentials. They live in a separate file with permissions 0600 and never appear in the Loxone project file."
K05 = "The library this plugin builds on notes that Anker allows <b>only one active token per account</b>: signing in with the app throws out the plugin session, and the plugin then signs in again. Whether that still holds for your account is answered by the counter on the Test tab — it counts failures and rejections."
K06 = "How to proceed"
K07 = "<b>Settings:</b> enter Anker user name, password and country code, save, then <i>start the service</i>."
K08 = "<b>Test:</b> the self-check answers line by line whether the setup holds. The first line really calls the plugin’s own endpoint. Every cross names the remedy."
K09 = "<b>MQTT:</b> publishing values via MQTT is on by default for new installations since 0.9.32. With MQTT&#8209;Gateway&nbsp;V2 the topic group appears in the subscriptions by itself; tick the data points for the sample project there (list in tab MQTT, status/ok with “Noncached”). With version&nbsp;1 enter the subscription. Since 0.9.33 the Test tab checks under MQTT gateway V2 that all data points of the tick list are ticked and “Noncached” is right."
K10 = "<b>Loxone integration:</b> step by step – values via MQTT (name table with the names the gateway creates in Loxone), commands via the command bridge, two block lists from the LoxBerry plugins sample project – values, messages and balance as well as the house load control with EVCC priority –, each with a picture and instructions for taking it over. The HTTP endpoint remains for existing installations."
K11 = "Request limits"
K12 = "The Anker cloud throttles: the energy statistics endpoint tolerates roughly ten to twelve requests per minute, then answers HTTP 429. A cycle below 60 seconds gains nothing anyway, because the device itself refreshes the cloud only every one to five minutes."
K13 = "Control"
K14 = "Write commands (house load, operating mode, discharge limit, grid export, backup reserve) are blocked by default and must be released explicitly. Unlike the Marstek storage there is <b>no watchdog</b>: a setpoint stays put even if Loxone fails. For Solarbank 2 and 3 the house load only works in mode manual (or smart plugs) – otherwise the plugin rejects it and says why."
K15 = "What is untested"
K16 = "This plugin was built without an Anker account and without a device. The field names of the cloud answer and the effect of the write commands could therefore not be measured on a live system. If a value stays empty, a wrongly guessed field name is more likely than a fault: the button <i>View raw cloud data</i> on the Test tab shows what the fields are really called on your system."
K17 = "Basis"
K18 = "The cloud connection uses the library <i>anker-solix-api</i> by thomluther (MIT). It is not an official Anker interface and can change at any time."
K19 = "The most effective brake is not the cycle but the <b>poll scope</b>: switch off the energy statistics or the device details in the settings if you do not need them. How often the cloud rejects is shown on the Test tab in the line about rejections."
K20 = "Since 0.9.7 the plugin can reset the operating mode itself after a configurable time without a setpoint. That is an intervention which happens without you, and therefore <b>off</b> by default. Write brake and step size, by contrast, are active by default — they keep a control loop in Loxone from driving the cloud into a block. A discarded command is reported, not silently swallowed."
K21 = "Before the first real command the <b>dry run</b> on the Test tab is worth it: it shows which locks apply, which device the command would reach and through which call — without sending anything."
K22 = "<b>Especially untested are the four commands added in 0.9.7:</b> blocking grid export, the export limit, the backup reserve and the inverter limit. Whoever uses them should check in the Anker app afterwards that what the plugin reports has actually happened."
K23 = "<b>OK and ALTER:</b> the endpoint reports <span class='sm-mono'>OK=1</span> only if the last poll succeeded <b>and</b> is no older than three times the polling interval (180 s at a 60 s interval). If it is older, it reports <span class='sm-mono'>OK=0</span>; <span class='sm-mono'>ALTER</span> keeps counting the seconds since the last success. This does not apply to MQTT: there <span class='sm-mono'>ok</span> is sent with every poll, and Loxone computes the age from <span class='sm-mono'>ts</span>."
K24 = "<b>Immediate poll and endpoint log:</b> <span class='sm-mono'>aktion=abruf</span> fetches the values right away instead of at the next cycle, but at most every 30 s. An earlier call gets HTTP 429 with <span class='sm-mono'>WARTEN_S</span> (seconds until the next allowed poll) and triggers nothing; the button on the Test tab goes through the same lock. This keeps a flapping output from driving the account into the Anker cloud lock. Rejected calls (token missing or wrong) and switching commands are written to the log by the endpoint with the sender address, at most one line per kind in ten minutes; the next line says how many calls came in between. The token never appears in it."
K25 = "<b>The same value is not sent twice:</b> if Loxone sends the same setpoint (home load, mode, discharge limit, grid export on/off, export limit, backup reserve, inverter limit) to the same system and device again within 60 s, the endpoint does not queue it again and answers <span class='sm-mono'>SET;OK=1;…;UNVERAENDERT=1</span>. A different value goes out immediately; write brake and step size still apply. Only a command the service has confirmed is remembered. Commands from the Test tab are never suppressed."
K26 = "<b>Writer watch:</b> for each system, the endpoint remembers who sends set points (house load, usage mode, discharge limit, feed-in, feed-in limit, backup reserve, inverter limit) - the identifier from <span class='sm-mono'>&amp;von=</span> and the sender address. The template sets <span class='sm-mono'>von=loxone</span>; known identifiers of the other house plugins are <span class='sm-mono'>einspeisebremse</span> (feed-in brake on the storage path), <span class='sm-mono'>awattar</span> and <span class='sm-mono'>evcc</span>. If several writers send commands to the same system within the time window (default 15 minutes), this is shown in the log, in the <i>Test</i> tab (writers of the last 24 hours) and in every further response as <span class='sm-mono'>;SCHREIBER=n</span>; nothing is rejected. Only with <i>Reject foreign writers</i> (off by default) does a writer that is not in the list get HTTP 409 <span class='sm-mono'>GRUND=FREMDSCHREIBER</span>, and nothing is queued; <span class='sm-mono'>modus=eigenverbrauch</span> always passes. An invalid identifier is rejected with HTTP 400 <span class='sm-mono'>GRUND=VON</span>; an address without <span class='sm-mono'>von</span> always works. The poll <span class='sm-mono'>aktion=abruf</span> and the reading calls ignore <span class='sm-mono'>von</span>."
K27 = "<b>Commands via MQTT:</b> with the tick “Accept commands via MQTT” (tab MQTT, off by default) the command bridge accepts setpoints, operating mode, feed-in and immediate poll from Loxone via the MQTT gateway – without a token in the project file, with the same checks as the HTTP route. The answer is at …/quittung."
K28 = "<b>Electricity price (display):</b> if a spot price plugin provides haus/strompreis, the plugin shows the price, the rank of the current hour and the cheapest hours next to the mode “time slot” (tab Settings, off by default). Nothing is controlled with it; the Solarbank plans with the tariff of the Anker app."
