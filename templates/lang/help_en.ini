; Help texts, English. Belongs to templates/help/help.html.
; Same quoting rules as the German file: every value in double quotes,
; none inside, attributes in markup single-quoted.

[HILFE]
K01 = "Anker SOLIX"
K02 = "Connects Anker SOLIX devices to Loxone: Solarbank E1600 (gen 1), Solarbank 2 (Plus, Pro, AC), Solarbank 3 E2700, smart meter, MI80 inverter, smart plugs, power stations, Power Panel and X1."
K03 = "Why through the cloud?"
K04 = "Anker SOLIX has <b>no local interface.</b> Neither the Solarbank nor the smart meter answer requests from the home network; every value goes through the Anker cloud. That is why the plugin needs your Anker credentials. They live in a separate file with permissions 0600 and never appear in the Loxone project file."
K05 = "The library this plugin builds on notes that Anker allows <b>only one active token per account</b>: signing in with the app throws out the plugin session, and the plugin then signs in again. Whether that still holds for your account is answered by the counter on the Test tab — it counts failures and rejections."
K06 = "How to proceed"
K07 = "<b>Settings:</b> enter Anker user name, password and country code, save, then <i>start the service</i>."
K08 = "<b>Test:</b> the self-check answers line by line whether the setup holds. The first line really calls the plugin’s own endpoint. Every cross names the remedy."
K09 = "<b>MQTT:</b> enter the subscription in the MQTT gateway. Without that entry nothing arrives at the Miniserver."
K10 = "<b>Loxone integration:</b> step by step, with ready-made import files and a complete block list for rebuilding."
K11 = "Request limits"
K12 = "The Anker cloud throttles: the energy statistics endpoint tolerates roughly ten to twelve requests per minute, then answers HTTP 429. A cycle below 60 seconds gains nothing anyway, because the device itself refreshes the cloud only every one to five minutes."
K13 = "Control"
K14 = "Write commands (house load, operating mode, discharge limit, grid export, backup reserve) are blocked by default and must be released explicitly. Unlike the Marstek storage there is <b>no watchdog</b>: a setpoint stays put even if Loxone fails."
K15 = "What is untested"
K16 = "This plugin was built without an Anker account and without a device. The field names of the cloud answer and the effect of the write commands could therefore not be measured on a live system. If a value stays empty, a wrongly guessed field name is more likely than a fault: the button <i>View raw cloud data</i> on the Test tab shows what the fields are really called on your system."
K17 = "Basis"
K18 = "The cloud connection uses the library <i>anker-solix-api</i> by thomluther (MIT). It is not an official Anker interface and can change at any time."
K19 = "The most effective brake is not the cycle but the <b>poll scope</b>: switch off the energy statistics or the device details in the settings if you do not need them. How often the cloud rejects is shown on the Test tab in the line about rejections."
K20 = "Since 0.9.7 the plugin can reset the operating mode itself after a configurable time without a setpoint. That is an intervention which happens without you, and therefore <b>off</b> by default. Write brake and step size, by contrast, are active by default — they keep a control loop in Loxone from driving the cloud into a block. A discarded command is reported, not silently swallowed."
K21 = "Before the first real command the <b>dry run</b> on the Test tab is worth it: it shows which locks apply, which device the command would reach and through which call — without sending anything."
K22 = "<b>Especially untested are the four commands added in 0.9.7:</b> blocking grid export, the export limit, the backup reserve and the inverter limit. Whoever uses them should check in the Anker app afterwards that what the plugin reports has actually happened."
