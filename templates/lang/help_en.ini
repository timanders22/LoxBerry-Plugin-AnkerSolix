; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Anker SOLIX"
K02 = "Connects Anker SOLIX devices to Loxone: Solarbank E1600 (gen 1), Solarbank 2 (Plus, Pro, AC), Solarbank 3 E2700, smart meter, MI80 inverter, smart plugs, power stations, power panel and X1."
K03 = "Why through the cloud?"
K04 = "Anker SOLIX has <b>no local interface.</b> Neither the Solarbank nor the smart meter answers requests from the home network; every value travels through the Anker cloud. That is why the plugin needs your Anker credentials. They are kept in a file of their own with permissions 0600 and never appear in the Loxone project file."
K05 = "Since July 2025 the same account may be logged in through the app and through other programs at the same time. A second, shared account is no longer necessary."
K06 = "How to proceed"
K07 = "<b>Settings:</b> enter the Anker user name, password and country code, save, then <i>Start service</i>."
K08 = "<b>Test:</b> the self-check tells you line by line whether it holds. Every failed line names the remedy."
K09 = "<b>MQTT:</b> enter the subscription in the MQTT gateway. Without that entry nothing arrives at the Miniserver."
K10 = "<b>Loxone integration:</b> step by step, with a complete list of blocks to rebuild it."
K11 = "Request limits"
K12 = "The Anker cloud throttles: the energy statistics tolerate roughly ten to twelve queries per minute, after which it answers with HTTP 429. An interval below 60 seconds gains nothing anyway, because the device itself only refreshes the cloud every one to five minutes."
K13 = "Control"
K14 = "Writing commands (house load, operating mode, discharge limit) are locked by default and have to be released explicitly. Unlike the Marstek battery there is <b>no watchdog</b>: a set point stays where it is, even if Loxone fails."
K15 = "What has not been tested"
K16 = "This plugin was built without an Anker account and without a device. The field names in the cloud reply and the effect of the writing commands could therefore not be measured against a live system. If a value stays empty, that is more likely a wrongly guessed field name than a fault: the <i>View raw data as JSON</i> button on the Test tab shows what the fields are really called on your system."
K17 = "Basis"
K18 = "The cloud connection uses the library <i>anker-solix-api</i> by thomluther (MIT). It is not an official Anker interface and may change at any time."
