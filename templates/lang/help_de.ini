; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben. Attribute im Markup einfach quotieren.

[HILFE]
K01 = "Anker SOLIX"
K02 = "Bindet Anker-SOLIX-Geräte an Loxone an: Solarbank E1600 (Gen 1), Solarbank 2 (Plus, Pro, AC), Solarbank 3 E2700, Smart Meter, MI80-Wechselrichter, Smart Plugs, Powerstations, Power Panel und X1."
K03 = "Warum über die Cloud?"
K04 = "Anker SOLIX hat <b>keine lokale Schnittstelle.</b> Weder die Solarbank noch der Smart Meter beantworten Anfragen aus dem Heimnetz; alle Werte laufen über die Anker-Cloud. Deshalb braucht das Plugin Ihre Anker-Zugangsdaten. Sie liegen in einer eigenen Datei mit den Rechten 0600 und stehen nie in der Loxone-Projektdatei."
K05 = "Die Bibliothek, auf der dieses Plugin aufsetzt, weist darauf hin, dass Anker <b>nur ein aktives Token je Konto</b> zulässt: eine Anmeldung in der App wirft die Sitzung des Plugins hinaus, und das Plugin meldet sich danach neu an. Ob das an Ihrem Konto noch so ist, sagt Ihnen der Zähler im Reiter Test — er zählt Fehlschläge und Abweisungen mit."
K06 = "So gehen Sie vor"
K07 = "<b>Einstellungen:</b> Anker-Benutzername, Passwort und Länderkürzel eintragen, speichern, dann <i>Dienst starten</i>."
K08 = "<b>Test:</b> Die Selbstprüfung sagt Zeile für Zeile, ob es trägt. Die erste Zeile ruft den eigenen Endpunkt wirklich auf. Jedes Kreuz nennt die Abhilfe mit."
K09 = "<b>MQTT:</b> Das Abo im MQTT-Gateway eintragen. Ohne diesen Eintrag kommt am Miniserver nichts an."
K10 = "<b>Einbindung in Loxone:</b> Schritt für Schritt, mit fertigen Importdateien und vollständiger Baustein-Liste zum Nachbauen."
K11 = "Anfragegrenzen"
K12 = "Die Anker-Cloud drosselt: die Energiestatistik verträgt etwa zehn bis zwölf Abfragen je Minute, danach antwortet sie mit HTTP 429. Ein Takt unter 60 Sekunden bringt ohnehin nichts, weil das Gerät die Cloud selbst nur ein- bis alle fünf Minuten auffrischt."
K13 = "Steuerung"
K14 = "Schreibende Befehle (Hauslast, Betriebsart, Entladegrenze, Einspeisung, Notstromreserve) sind ab Werk gesperrt und müssen ausdrücklich freigegeben werden. Anders als beim Marstek-Speicher gibt es <b>keinen Watchdog</b>: ein gesetzter Sollwert bleibt stehen, auch wenn Loxone ausfällt."
K15 = "Was ungeprüft ist"
K16 = "Dieses Plugin wurde ohne Anker-Konto und ohne Gerät gebaut. Die Feldnamen der Cloud-Antwort und die Wirkung der schreibenden Befehle konnten deshalb nicht am lebenden System nachgemessen werden. Bleibt ein Wert leer, ist das eher ein falsch geratener Feldname als eine Störung: der Knopf <i>Rohdaten der Cloud ansehen</i> im Reiter Test zeigt, wie die Felder bei Ihnen wirklich heißen."
K17 = "Grundlage"
K18 = "Die Cloud-Anbindung nutzt die Bibliothek <i>anker-solix-api</i> von thomluther (MIT). Sie ist keine amtliche Anker-Schnittstelle und kann sich jederzeit ändern."
K19 = "Die wirksamste Bremse ist nicht der Takt, sondern der <b>Abrufumfang</b>: wer die Energiestatistik oder die Gerätedetails nicht braucht, schaltet sie in den Einstellungen ab. Wie oft die Cloud abweist, steht im Reiter Test unter der Zeile zu den Abweisungen."
K20 = "Seit 0.9.7 kann das Plugin die Betriebsart nach einer einstellbaren Zeit ohne Sollwert selbst zurückstellen. Das ist ein Eingriff, der ohne Ihr Zutun geschieht, und deshalb ab Werk <b>aus</b>. Ab Werk aktiv sind dagegen Schreibbremse und Schrittweite — sie halten einen Regelkreis in Loxone davon ab, die Cloud in die Sperre zu treiben. Ein verworfener Befehl wird gemeldet, nicht stillschweigend geschluckt."
K21 = "Vor dem ersten scharfen Befehl lohnt der <b>Trockenlauf</b> im Reiter Test: er zeigt, welche Sperren greifen, an welches Gerät der Befehl ginge und über welchen Aufruf — ohne etwas abzusetzen."
K22 = "<b>Besonders unerprobt sind die vier Befehle, die in 0.9.7 hinzugekommen sind:</b> Netzeinspeisung sperren, Einspeisegrenze, Notstromreserve und die Begrenzung des Wechselrichters. Wer sie benutzt, sollte danach in der Anker-App nachsehen, ob wirklich das geschehen ist, was das Plugin meldet."
