; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Anker SOLIX"
K02 = "Bindet Anker-SOLIX-Geräte an Loxone an: Solarbank E1600 (Gen 1), Solarbank 2 (Plus, Pro, AC), Solarbank 3 E2700, Smart Meter, MI80-Wechselrichter, Smart Plugs, Powerstations, Power Panel und X1."
K03 = "Warum über die Cloud?"
K04 = "Anker SOLIX hat <b>keine lokale Schnittstelle.</b> Weder die Solarbank noch der Smart Meter beantworten Anfragen aus dem Heimnetz; alle Werte laufen über die Anker-Cloud. Deshalb braucht das Plugin Ihre Anker-Zugangsdaten. Sie liegen in einer eigenen Datei mit den Rechten 0600 und stehen nie in der Loxone-Projektdatei."
K05 = "Seit Juli 2025 darf dasselbe Konto parallel in der App und in weiteren Programmen angemeldet sein. Ein zweites, geteiltes Konto ist nicht mehr nötig."
K06 = "So gehen Sie vor"
K07 = "<b>Einstellungen:</b> Anker-Benutzername, Passwort und Länderkürzel eintragen, speichern, dann <i>Dienst starten</i>."
K08 = "<b>Test:</b> Die Selbstprüfung sagt Zeile für Zeile, ob es trägt. Jedes Kreuz nennt die Abhilfe mit."
K09 = "<b>MQTT:</b> Das Abo im MQTT-Gateway eintragen. Ohne diesen Eintrag kommt am Miniserver nichts an."
K10 = "<b>Einbindung in Loxone:</b> Schritt für Schritt, mit vollständiger Baustein-Liste zum Nachbauen."
K11 = "Anfragegrenzen"
K12 = "Die Anker-Cloud drosselt: die Energiestatistik verträgt etwa zehn bis zwölf Abfragen je Minute, danach antwortet sie mit HTTP 429. Ein Takt unter 60 Sekunden bringt ohnehin nichts, weil das Gerät die Cloud selbst nur ein- bis alle fünf Minuten auffrischt."
K13 = "Steuerung"
K14 = "Schreibende Befehle (Hauslast, Betriebsart, Entladegrenze) sind ab Werk gesperrt und müssen ausdrücklich freigegeben werden. Anders als beim Marstek-Speicher gibt es <b>keinen Watchdog</b>: ein gesetzter Sollwert bleibt stehen, auch wenn Loxone ausfällt."
K15 = "Was ungeprüft ist"
K16 = "Dieses Plugin wurde ohne Anker-Konto und ohne Gerät gebaut. Die Feldnamen der Cloud-Antwort und die Wirkung der schreibenden Befehle konnten deshalb nicht am lebenden System nachgemessen werden. Bleibt ein Wert leer, ist das eher ein falsch geratener Feldname als eine Störung: der Knopf <i>Rohdaten als JSON ansehen</i> im Reiter Test zeigt, wie die Felder bei Ihnen wirklich heißen."
K17 = "Grundlage"
K18 = "Die Cloud-Anbindung nutzt die Bibliothek <i>anker-solix-api</i> von thomluther (MIT). Sie ist keine amtliche Anker-Schnittstelle und kann sich jederzeit ändern."
