[LOX]
EINLEITUNG = "Loxone ist der Energiemanager: Das Plugin liefert die Messwerte, der Miniserver entscheidet. Zwei Wege stehen zur Verfügung — MQTT ist der Regelweg, der HTTP-Endpunkt die Alternative, wenn einzelne Werte gezielt geholt oder Befehle gesendet werden sollen."
H_TITEL = "Einbindung in Loxone, Schritt für Schritt"
KEIN_ZIP = "Das Sammelpaket braucht die PHP-Erweiterung <span class='sm-mono'>zip</span>. Sie steht nicht in <span class='sm-mono'>dpkg/apt</span> und ist deshalb nicht zugesichert. Die einzelnen Vorlagen unten gehen trotzdem."
K_ERZEUGEN = "erzeugen"
K_TOKEN_NEU = "Neues Token erzeugen"
K_VORLAGE = "Vorlage Leistungswerte erzeugen"
K_VORLAGE_ALLES = "Alles auf einmal anlegen (ZIP)"
K_VORLAGE_AUSGANG = "Vorlage der Steuerbefehle erzeugen"
K_VORLAGE_ENERGIE = "Vorlage Energiewerte erzeugen"
MEHRERE_ANLAGEN = "Mehrere Anlagen: je Anlage eine eigene Adresse, die Titel entsprechend mit der Anlagennummer versehen."
S10_ERLAEUTERUNG = "<b>Zu #9:</b> Die Schwelle liegt bewusst weit über dem Abholtakt. Bei 60 s Takt löst ein einzelner verpasster Durchlauf sonst schon eine Meldung aus.<br><b>Zu #11 und #13:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein. Deshalb niemals mehrere Quellen direkt an seinen Eingang legen, sondern erst über ein ODER zusammenführen — sonst verschluckt eine dauerhaft aktive Quelle alle übrigen.<br><b>Zu #22 und #24:</b> Der Sollwert wird im festen Takt neu gesendet, und der Impuls wird auf den Wert addiert. Ohne diesen winzigen Wechsel sendet Loxone einen unveränderten Analogwert nicht erneut — nach einem Neustart des Speichers stünde dort dann tagelang nichts.<br><b>Zu #25:</b> Anker kennt keinen Watchdog. Fällt Loxone aus, bleibt der zuletzt gesendete Sollwert stehen. Wer das nicht will, lässt Loxone vor dem geplanten Herunterfahren einmal die Betriebsart <span class='sm-mono'>eigenverbrauch</span> senden.<br><b>Optional</b> sind #14 bis #16 (Warnung bei niedrigem Ladezustand) und #26 (Tagesbilanz)."
S10_TEXT = "Wer diese Tabelle von oben nach unten abarbeitet, hat die Funktion nachgebaut, ohne nachzudenken. Loxone Config führt alle Bausteine in der Baustein-Suche (F5)."
S10_TITEL = "Schritt 10: Komplette Baustein-Liste zum Nachbauen"
S11_TEXT = "Diese vier Adressen im Browser aufrufen. Die erste prüft das Token, <b>ohne dass etwas geschieht</b> — genau dafür ist sie da."
S11_TITEL = "Schritt 11: Gegenprobe"
S1_TEXT = "<b>MQTT ist der Regelweg.</b> Das Gateway erzeugt die Namen der virtuellen Eingänge selbst; in Loxone genügt dann ein passend benannter virtueller Eingang. Der HTTP-Weg verlangt je Wert eine eigene Befehlserkennung — dafür kann er auch schalten, was MQTT hier nicht kann. Beides parallel ist erlaubt und in vielen Anlagen sinnvoll: MQTT für die laufenden Werte, HTTP für die Befehle."
S1_TITEL = "Schritt 1: Weg festlegen"
S2_TEXT = "In <i>System → MQTT Gateway</i> unter <i>Subscriptions</i> eintragen und speichern:"
S2_TITEL = "Schritt 2: Abo im MQTT-Gateway eintragen"
S2_WARNUNG = "<b>Ohne diesen Eintrag kommt am Miniserver nichts an.</b> Das ist die häufigste Fehlerursache überhaupt."
S3_BEFEHLE = "Darunter je Wert ein <i>Virtueller HTTP-Eingang Befehl</i>. In der Befehlserkennung steht der Suchtext zwischen <span class='sm-mono'>\i...\i</span>, <span class='sm-mono'>\v</span> nimmt die Zahl dahinter auf."
S3_SEMIKOLON = "<b>Das Semikolon vor dem Feldnamen gehört ins Muster</b>, und zwar zwingend. Loxone sucht die Zeichenkette wörtlich und nimmt den ersten Treffer: ohne führendes Semikolon fände <span class='sm-mono'>LADEN=</span> auch die Stelle in <span class='sm-mono'>ENTLADEN=</span>. Dass es heute noch gutginge, läge nur an der Reihenfolge in der Zeile. Ein falscher Wert ist schlimmer als ein fehlender."
S3_STRICH = "<b>Ein Strich statt einer Zahl</b> bedeutet: die Cloud hat dieses Feld nicht geliefert. Es wird bewusst keine 0 gesendet — eine 0 wäre eine stille Falschaussage. Loxone behält dann den zuletzt gültigen Wert. Genau deshalb gehören <span class='sm-mono'>ALTER</span> und <span class='sm-mono'>OK</span> immer mit ausgewertet: ohne sie sieht ein eingefrorener Wert in der App aus wie ein aktueller."
S3_TEXT = "Über MQTT entstehen die Eingänge von selbst. Wer den HTTP-Weg nimmt, legt in Loxone Config einen <i>Virtuellen HTTP-Eingang</i> mit dieser Adresse an:"
S3_TITEL = "Schritt 3: Virtuelle Eingänge für die Leistungswerte anlegen"
S4_TEXT = "Diese Werte kommen aus der Energiestatistik der Anker-Cloud und ändern sich langsam. 300 Sekunden genügen; häufiger abzufragen bringt nichts, weil der Dienst sie ohnehin nur alle paar Minuten auffrischt."
S4_TITEL = "Schritt 4: Virtueller Eingang für die Tagesenergien"
S4_ZEITRAUM = "Dieselbe Adresse mit <span class='sm-mono'>&amp;zeitraum=monat</span> oder <span class='sm-mono'>&amp;zeitraum=jahr</span> liefert statt der Tageswerte die Summen des laufenden Monats bzw. Jahres — <b>unter denselben Feldnamen</b>, damit dieselbe Importvorlage passt. Die Summen bildet das Plugin aus seiner eigenen Tagesaufzeichnung; die Cloud liefert nur „heute“."
S5_TEXT = "Neben der Anlage lässt sich jedes erkannte Gerät einzeln abfragen — Speicher, Smart Meter, Wechselrichter, Steckdose. Das lohnt sich, wenn mehrere Speicher an einer Anlage hängen oder wenn Sie die WLAN-Güte eines einzelnen Geräts überwachen wollen."
S5_TITEL = "Schritt 5: Einzelne Geräte abfragen"
S6_MODI = "Erlaubte Werte für <span class='sm-mono'>wert=</span>: <span class='sm-mono'>eigenverbrauch</span>, <span class='sm-mono'>steckdosen</span>, <span class='sm-mono'>manuell</span>, <span class='sm-mono'>zeitplan</span>, <span class='sm-mono'>smart</span>. Alles andere wird abgewiesen und gemeldet, nicht zurechtgebogen. Betriebsarten gibt es erst ab der Solarbank 2; die Solarbank 1 kennt nur Zeitpläne."
S6_TEXT = "Nur nötig, wenn Loxone den Speicher steuern soll. Voraussetzung: im Reiter Einstellungen sind schreibende Befehle freigegeben. Ein <i>Virtueller Ausgang</i> mit der Adresse des LoxBerry, darunter je Befehl ein <i>Virtueller Ausgang Befehl</i>; <span class='sm-mono'>&lt;v&gt;</span> setzt Loxone durch den Zahlenwert."
S6_TITEL = "Schritt 6: Befehle senden (Virtueller Ausgang)"
S6_UNGEPRUEFT = "<b>Einspeisung, Einspeisegrenze, Notstromreserve und die Wechselrichter-Begrenzung sind neu in 0.9.7 und an keinem Gerät erprobt.</b> Sie greifen über <span class='sm-mono'>set_station_parm</span> beziehungsweise <span class='sm-mono'>set_device_pv_power</span> in die Anlage ein. Wer sie benutzt, sollte danach in der Anker-App nachsehen, ob wirklich das geschehen ist, was hier steht."
S6_WARNUNG = "<b>Diese Befehle sind ungeprüft.</b> Sie wurden aus der Bibliothek abgeleitet, aber mangels Gerät nie an einer echten Anlage ausgeführt. Erproben Sie sie erst im Reiter Test mit der Anker-App daneben, bevor Sie eine Automatik darauf bauen. Anders als beim Marstek-Speicher gibt es hier <b>keinen Watchdog</b>: der gesetzte Sollwert bleibt stehen, auch wenn Loxone ausfällt."
S7_TEXT = "Schweigt die Cloud, behalten die virtuellen Eingänge ihren letzten Wert — in der App sieht dann alles normal aus. Deshalb wird <span class='sm-mono'>ALTER</span> ausgewertet: es zählt die Sekunden seit dem letzten erfolgreichen Abruf. Die Schwelle deutlich über den Abholtakt legen, damit ein einzelner verpasster Durchlauf keine Meldung auslöst: bei 60 s Takt ist 300 s ein guter Wert. Nebenbei erspart <span class='sm-mono'>ALTER</span> jede Zeitrechnung — Loxone zählt Sekunden seit dem 01.01.2009, ein Unix-Zeitstempel müsste also erst um 1230768000 verringert werden."
S7_TITEL = "Schritt 7: Ausfallerkennung"
S8_TEXT = "Der Endpunkt liegt im unangemeldeten Bereich, damit Loxone ihn ohne Zugangsdaten erreicht. Deshalb ist er durch ein Token geschützt; ohne passendes Token antwortet er mit HTTP 403. Ein neues Token macht alle bereits eingetragenen Adressen im Miniserver ungültig — danach müssen sie angepasst werden."
S8_TITEL = "Schritt 8: Das Token"
S9_TEXT = "Statt jeden virtuellen Eingang von Hand anzulegen: die fertige Importdatei erzeugen und in Loxone Config einlesen. Die Tabellen oben bleiben trotzdem stehen — sie erklären, was importiert wird."
S9_TITEL = "Schritt 9: Vorlagen für Loxone Config"
