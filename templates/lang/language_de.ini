FEHLER_HAUSLAST_TAUSCH = "Die kleinste erlaubte Hauslast ist größer als die größte. Bitte die beiden Werte vertauschen."
FEHLER_LAND = "Das Länderkürzel muss aus genau zwei Buchstaben bestehen, zum Beispiel DE."
FEHLER_RUECKFALL_MODUS = "Die Betriebsart für den Rückfall ist unbekannt."
FEHLER_SPEICHERN = "Die Konfiguration ließ sich nicht schreiben: %s"
FEHLER_TOPIC = "Das Themen-Präfix darf nur Buchstaben, Ziffern, Bindestrich, Unterstrich und Schrägstrich enthalten, höchstens 64 Zeichen lang sein, nicht mit einem Schrägstrich beginnen oder enden, keine zwei Schrägstriche hintereinander enthalten und nicht leer sein. Es wurde nichts geändert."
FEHLER_ZAHL = "%s: bitte eine ganze Zahl eintragen."
FEHLER_ZUGANG_SPEICHERN = "Die Zugangsdaten ließen sich nicht speichern. Rechte des Konfigurationsordners prüfen."
EINGABEN_ZURUECK = "Übernommen wurde nichts, weder gespeichert noch gesendet. Ihre Eingaben stehen wieder im Formular, das beanstandete Feld ist rot umrandet. Ein eingetipptes Passwort kommt aus Sicherheitsgründen nicht zurück - bitte erneut eingeben."
GESPEICHERT = "Die Einstellungen wurden gespeichert, samt Sicherungskopie für Updates."
H_ABLAGE = "Aufzeichnung"
H_ANFRAGE_FRIST = "Nach dieser Zeit gilt eine Anfrage als gescheitert. Ohne Zeitschranke kann ein Abruf, den die Gegenstelle offen lässt, den Dienst dauerhaft anhalten — und der Minutenwächter startet ihn nicht neu, weil der Prozess ja lebt."
H_ANFRAGE_PAUSE = "Werkseinstellung der Bibliothek ist 3, also 0,3 s. Größer machen, wenn die Cloud mit 429 abweist."
H_DIENST = "Abrufdienst"
H_EMAIL = "Dieselbe Adresse, mit der Sie sich in der Anker-App anmelden."
H_ENDPUNKT_LIMIT = "Wird an die Bibliothek weitergereicht, sofern diese es unterstützt. 10 entspricht der beobachteten Grenze."
H_ENERGIE_TAGE = "Aus diesen Tageswerten entstehen die Monats- und Jahressummen und die fortlaufenden Zählerstände. 400 Tage decken ein volles Jahr samt Vorjahresvergleich ab; die Datei bleibt dabei unter 30 kB je Anlage."
H_ERKANNT = "Erkannte Geräte"
H_GRENZEN_ANLAGE = "Grenzen je Anlage"
H_GRENZEN_ANLAGE_TEXT = "Ein gemeinsames Maximum für eine Solarbank E1600 und eine Solarbank 3 ist entweder zu klein oder zu groß. Ein leeres Feld heißt: es gilt der allgemeine Wert darüber — nicht 0."
H_HAUSLAST = "Werte ausserhalb dieser Grenzen werden abgewiesen und gemeldet, nicht stillschweigend gekappt. Tragen Sie hier ein, was Ihr Gerät kann: die Solarbank 2 und 3 gehen üblicherweise bis 800 W, in Ländern ohne 800-W-Grenze auch höher. Der Wert steht in der Anker-App beim Einstellen der Ausgangsleistung."
H_INTERVALL = "60 Sekunden sind der sinnvolle Standard. Die Cloud selbst wird vom Gerät höchstens einmal je Minute aufgefrischt, teilweise nur alle fünf Minuten — ein kürzerer Takt liefert deshalb keine neueren Werte, sondern nur mehr Anfragen."
H_KONTO = "Anker-Konto"
H_LAND = "Zwei Buchstaben, zum Beispiel <span class='sm-mono'>DE</span> oder <span class='sm-mono'>AT</span>. Gemeint ist das Land, mit dem das Anker-Konto angelegt wurde — nicht die eingestellte Sprache."
H_MELDEN = "Benachrichtigungen"
H_MELDEN_ALTER = "Ein einzelner Aussetzer ist kein Anlass. 900 s bedeutet: erst nach einer Viertelstunde ohne erfolgreichen Abruf."
H_MELDEN_EIN = "Ohne das erfährt niemand von einer Störung: der Dienst liefe tagelang mit Abweisungen weiter, und man merkte es erst beim Öffnen dieser Seite."
H_MQTT = "Veröffentlichung"
H_MQTT_AENDERUNG = "Spart Nachrichten. <span class='sm-mono'>ok</span>, <span class='sm-mono'>ts</span> und <span class='sm-mono'>fehler</span> gehen trotzdem in jedem Takt hinaus — wer nur bei Änderungen sendet, hört bei einer Störung sonst einfach auf, und in Loxone sieht ein toter Dienst dann aus wie ein ruhiges Haus. Alle 30 Minuten geht außerdem der volle Satz hinaus, damit ein unterwegs verlorenes Datagramm nicht bis zur nächsten Änderung fehlt."
H_MQTT_TOPIC = "Alle Themen beginnen damit. Was genau veröffentlicht wird, steht im Reiter MQTT."
H_OHNE_PROGNOSE = "Ab Werk aus. Die Prognose kostet eine eigene Anfrage je Anlage und Stunde; sie liefert dafür den Rest-Ertrag des Tages — die nützlichste einzelne Zahl für eine Regelung in Loxone."
H_PASSWORT = "Bleibt das Feld leer, wird das gespeicherte Passwort beibehalten. Es wird nirgends angezeigt — der Reiter Test nennt nur seine Länge."
H_RUECKFALL_MIN = "Anker kennt <b>keinen Watchdog</b>: ein gesetzter Sollwert bleibt stehen, auch wenn Loxone ausfällt. Kommt so lange kein gültiger Sollwert von Loxone mehr, stellt das Plugin die Betriebsart selbst zurück. Auch ein unveränderter Sollwert zählt, den das Plugin nicht erneut sendet (gleicher Wert innerhalb 60 s, Schrittweite); Befehle aus dem Reiter Test zählen nur, wenn sie gesendet werden. <b>0 schaltet das ab</b> — und ab Werk ist es aus, denn es ist ein Eingriff, der ohne Ihr Zutun geschieht."
H_SCHREIBBREMSE = "Ein Regelkreis in Loxone, der im Sekundentakt einen neuen Sollwert schickt, läuft geradewegs in die 429-Sperre der Cloud. Ein verworfener Befehl wird <b>gemeldet</b>, nicht stillschweigend geschluckt. 0 schaltet die Bremse ab."
H_SCHRITTWEITE = "Eine Änderung um wenige Watt kostet eine Cloud-Anfrage und bewirkt am Gerät nichts. Kleinere Sprünge werden nicht gesendet; die Antwort ist trotzdem OK=1, mit UNVERAENDERT=1 und dem Grund. 0 schaltet die Prüfung ab."
H_SICHERUNG = "Einstellungen sichern und zurückspielen"
H_STEUERUNG = "Schreibende Befehle"
H_TAKT = "Abfragetakt"
H_TAKT_DETAILS = "Einstellungen, Firmware und Ausstattung ändern sich selten. Bei Takt 60 s bedeuten 10 Takte: alle zehn Minuten."
H_TAKT_ENERGIE = "Die Energiestatistik ist der teuerste Abruf. Anker drosselt diesen Endpunkt auf etwa zehn bis zwölf Anfragen je Minute; danach kommt HTTP 429 zurück. 15 Takte sind ein ruhiger Wert."
H_TAKT_PROGNOSE = "Die Bibliothek lässt höchstens eine Auffrischung je Stunde zu. 60 ist deshalb der kleinste sinnvolle Wert."
H_UMFANG = "Abrufumfang"
H_VERLAUF_TAGE = "Die Messpunkte der Tagesgrafik. Ältere Dateien räumt der Dienst selbsttätig weg."
H_WARTEZEIT = "So lange wartet der Miniserver-Endpunkt auf das Ergebnis eines Befehls. Kommt in dieser Zeit nichts, meldet er <span class='sm-mono'>OK=2</span> — eingereiht, Ergebnis unbekannt. Er meldet nie einen Erfolg, den niemand geprüft hat."
H_WEG = "Der <b>Befehlsweg</b> sagt, welcher Aufruf der Bibliothek dieses Gerät träfe — er hängt an der Gerätegeneration. Wer diese Fassung erprobt, kann damit einen Befund einordnen, ohne im Quelltext nachzusehen. Die <b>Entladegrenzen</b> fragt der Dienst einmal am Tag beim Gerät ab; ein Strich heißt, dass noch keine Antwort vorliegt."
H_ZAEHLER_EIN = "Die Cloud liefert nur den Tageswert, und um Mitternacht fällt er auf 0 zurück. Loxone rechnet mit fortlaufenden Zählerständen; das Plugin bildet sie aus den Tagessummen. Sie können nur steigen — ein nachträglich korrigierter Tageswert wird nie abgezogen."
KEINE_GERAETE = "Es sind noch keine Geräte bekannt. Das ist normal, solange der Dienst nicht gelaufen ist oder die Anmeldung nicht geklappt hat. Der Reiter Test sagt, woran es liegt."
KONTO_ERKLAERUNG = "<b>Anker SOLIX hat keine lokale Schnittstelle.</b> Weder die Solarbank noch der Smart Meter beantworten Anfragen aus dem Heimnetz; alle Werte laufen über die Anker-Cloud. Dieses Plugin meldet sich deshalb mit Ihren Anker-Zugangsdaten an. Die Daten liegen in einer eigenen Datei mit den Rechten 0600, nicht in der Konfiguration, die diese Seite anzeigt, und sie stehen nie in der Loxone-Projektdatei. Seit Juli 2025 darf dasselbe Konto parallel in App und auf weiteren Geräten angemeldet sein — ein zweites Konto ist nicht mehr nötig."
