FEHLER_WACHE_LISTE = "Erlaubte Schreiber: nicht verstanden: %s. Erlaubt ist je Eintrag eine Kennung (1 bis 32 Zeichen aus Buchstaben, Ziffern, _ und -), eine Adresse oder Kennung@Adresse, höchstens 16 Einträge, keine Steuerzeichen. Nichts wurde gespeichert."
FEHLER_WACHE_LANG = "Erlaubte Schreiber: die Liste ist länger als 512 Zeichen. Nichts wurde gespeichert."
FEHLER_WACHE_LEER = "Fremde Schreiber abweisen ist eingeschaltet, die Liste der erlaubten Schreiber aber leer - damit würde jeder Sollwert abgewiesen, auch der von Loxone. Nichts wurde gespeichert."
SICH_WACHE_LISTE = "erwartet je Eintrag eine Kennung (1 bis 32 Zeichen aus Buchstaben, Ziffern, _ und -), eine Adresse oder Kennung@Adresse, getrennt durch Komma, Semikolon oder Leerzeichen, höchstens 16 Einträge und 512 Zeichen, keine Steuerzeichen."
SICH_WACHE_KREUZ = "In der Datei ist Fremde Schreiber abweisen eingeschaltet, die Liste der erlaubten Schreiber aber leer - damit würde jeder Sollwert abgewiesen."
WAS_IST_DAS = "<b>Anker SOLIX am Loxone Miniserver.</b> Das Plugin liest Solarbank, Smart Meter, Wechselrichter, Smart Plugs und Powerstations aus. Eine lokale Schnittstelle bietet Anker nicht; ein Abrufdienst holt die Werte deshalb mit den hinterlegten Zugangsdaten im eingestellten Takt aus der Anker-Cloud. Die Werte gehen über MQTT und über einen tokengeschützten HTTP-Endpunkt an den Miniserver; nach Freigabe nimmt das Plugin dort auch Sollwerte und Betriebsarten entgegen und reicht sie an die Cloud weiter."
