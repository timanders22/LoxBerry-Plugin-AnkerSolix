; Anker SOLIX - Sprachdatei Deutsch
;
; Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt selbst keine.
; Markup in einem Wert quotiert seine Attribute EINFACH (class='sm-mono'):
; ein weiteres " beendet den Wert vorzeitig, und je nach Lesemodus wird der
; Wert abgeschnitten oder die ganze Datei abgewiesen - beides stumm.
; Anfuehrungen im Text sind typografisch.
;
; Gegenprobe: python3 Werkzeuge/ini_pruefen.py PLUGINORDNER

