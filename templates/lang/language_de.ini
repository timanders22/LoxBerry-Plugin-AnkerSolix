VON_HINWEIS = "Jede Sollwert-Adresse trägt <span class='sm-mono'>&amp;von=loxone</span>. Daran unterscheidet die Schreiber-Wache (Reiter <i>Einstellungen</i>) den Miniserver von anderen Schreibern; bekannte Kennungen der übrigen Hausplugins sind <span class='sm-mono'>einspeisebremse</span>, <span class='sm-mono'>awattar</span> und <span class='sm-mono'>evcc</span>. Eine ältere Vorlage ohne diesen Zusatz arbeitet weiter und erscheint im Reiter <i>Test</i> als <i>ohne Kennung</i>. <b>Bestehende Einbindung:</b> an die vorhandenen Befehle des virtuellen Ausgangs <span class='sm-mono'>&amp;von=loxone</span> anhängen statt neu zu importieren - ein Neuimport legt die Bausteine doppelt an."
