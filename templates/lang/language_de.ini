L_WACHE_LB = "Zusätzlich als LoxBerry-Meldung, sobald neue Schreiber hinzukommen"
L_WACHE_SPERREN = "Fremde Schreiber abweisen (HTTP 409)"
H_WACHE_SPERREN = "<b>Ab Werk aus.</b> Erst einschalten, wenn der Reiter <i>Test</i> eine Woche lang nur die erwarteten Schreiber zeigt. Dann bekommt jeder Sollwert eines Schreibers, der nicht in der Liste steht, HTTP 409 <span class='sm-mono'>GRUND=FREMDSCHREIBER</span>, und es wird nichts eingereiht. Die Rücknahme <span class='sm-mono'>modus=eigenverbrauch</span> (die Solarbank regelt wieder selbst nach dem Smart Meter) wird nie abgewiesen. Achtung: Eine Loxone-Vorlage ohne <span class='sm-mono'>von=loxone</span> erscheint als <i>ohne Kennung</i> und wäre mit der Liste <span class='sm-mono'>loxone</span> ausgesperrt - dann die Adresse des Miniservers mit eintragen."
L_WACHE_ERLAUBT = "Erlaubte Schreiber"
