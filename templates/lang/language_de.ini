H_WACHE = "Schreiber-Wache"
H_WACHE_TEXT = "Der Endpunkt merkt sich je Anlage, wer Sollwerte schickt: die Kennung aus <span class='sm-mono'>&amp;von=</span> (die Vorlage setzt <span class='sm-mono'>von=loxone</span>) und die Adresse des Absenders. Schicken im Zeitfenster mehrere Schreiber Befehle an dieselbe Anlage, steht das im Protokoll, im Reiter <i>Test</i> und in der Antwort als <span class='sm-mono'>;SCHREIBER=n</span>. Abgewiesen wird dadurch nichts."
L_WACHE_EIN = "Mehrere Schreiber melden (Protokoll, Reiter Test)"
