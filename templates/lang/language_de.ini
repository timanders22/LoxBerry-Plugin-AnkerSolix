[LOX]
EINLEITUNG = "Loxone ist der Energiemanager: Das Plugin liefert die Messwerte, der Miniserver entscheidet. Zwei Wege stehen zur Verf&uuml;gung &mdash; MQTT ist der Regelweg, der HTTP-Endpunkt die Alternative, wenn einzelne Werte gezielt geholt oder Befehle gesendet werden sollen."
H_TITEL = "Einbindung in Loxone, Schritt für Schritt"
K_TOKEN_NEU = "Neues Token erzeugen"
K_VORLAGE = "Vorlage für Loxone Config herunterladen"
MEHRERE_ANLAGEN = "Mehrere Anlagen: je Anlage eine eigene Adresse, die Titel entsprechend mit der Anlagennummer versehen."
S1_TEXT = "<b>MQTT ist der Regelweg.</b> Das Gateway erzeugt die Namen der virtuellen Eing&auml;nge selbst; in Loxone gen&uuml;gt dann ein passend benannter virtueller Eingang. Der HTTP-Weg verlangt je Wert eine eigene Befehlserkennung &mdash; daf&uuml;r kann er auch schalten, was MQTT hier nicht kann. Beides parallel ist erlaubt und in vielen Anlagen sinnvoll: MQTT f&uuml;r die laufenden Werte, HTTP f&uuml;r die Befehle."
S1_TITEL = "Schritt 1: Weg festlegen"
S2_TEXT = "In <i>System &rarr; MQTT Gateway</i> unter <i>Subscriptions</i> eintragen und speichern:"
S2_TITEL = "Schritt 2: Abo im MQTT-Gateway eintragen"
S2_WARNUNG = "<b>Ohne diesen Eintrag kommt am Miniserver nichts an.</b> Das ist die h&auml;ufigste Fehlerursache &uuml;berhaupt."
S3_BEFEHLE = "Darunter je Wert ein <i>Virtueller HTTP-Eingang Befehl</i>. In der Befehlserkennung steht der Suchtext zwischen <span class='sm-mono'>\i...\i</span>, <span class='sm-mono'>\v</span> nimmt die Zahl dahinter auf."
S3_STRICH = "<b>Ein Strich statt einer Zahl</b> bedeutet: die Cloud hat dieses Feld nicht geliefert. Es wird bewusst keine 0 gesendet &mdash; eine 0 w&auml;re eine stille Falschaussage. Loxone beh&auml;lt dann den zuletzt g&uuml;ltigen Wert. Genau deshalb geh&ouml;ren <span class='sm-mono'>ALTER</span> und <span class='sm-mono'>OK</span> immer mit ausgewertet: ohne sie sieht ein eingefrorener Wert in der App aus wie ein aktueller."
S3_TEXT = "&Uuml;ber MQTT entstehen die Eing&auml;nge von selbst. Wer den HTTP-Weg nimmt, legt in Loxone Config einen <i>Virtuellen HTTP-Eingang</i> mit dieser Adresse an:"
S3_TITEL = "Schritt 3: Virtuelle Eingänge für die Leistungswerte anlegen"
S4_TEXT = "Diese Werte kommen aus der Energiestatistik der Anker-Cloud und &auml;ndern sich langsam. 300 Sekunden gen&uuml;gen; h&auml;ufiger abzufragen bringt nichts, weil der Dienst sie ohnehin nur alle paar Minuten auffrischt."
S4_TITEL = "Schritt 4: Virtueller Eingang für die Tagesenergien"
S5_MODI = "Erlaubte Werte f&uuml;r <span class='sm-mono'>wert=</span>: <span class='sm-mono'>eigenverbrauch</span>, <span class='sm-mono'>steckdosen</span>, <span class='sm-mono'>manuell</span>, <span class='sm-mono'>zeitplan</span>, <span class='sm-mono'>smart</span>. Alles andere wird abgewiesen und gemeldet, nicht zurechtgebogen. Betriebsarten gibt es erst ab der Solarbank 2; die Solarbank 1 kennt nur Zeitpl&auml;ne."
S5_TEXT = "Nur n&ouml;tig, wenn Loxone den Speicher steuern soll. Voraussetzung: im Reiter Einstellungen sind schreibende Befehle freigegeben. Ein <i>Virtueller Ausgang</i> mit der Adresse des LoxBerry, darunter je Befehl ein <i>Virtueller Ausgang Befehl</i>; <span class='sm-mono'>&lt;v&gt;</span> setzt Loxone durch den Zahlenwert."
S5_TITEL = "Schritt 5: Befehle senden (virtueller Ausgang)"
S5_WARNUNG = "<b>Diese Befehle sind ungepr&uuml;ft.</b> Sie wurden aus der Bibliothek abgeleitet, aber mangels Ger&auml;t nie an einer echten Anlage ausgef&uuml;hrt. Erproben Sie sie erst im Reiter Test mit der Anker-App daneben, bevor Sie eine Automatik darauf bauen. Anders als beim Marstek-Speicher gibt es hier <b>keinen Watchdog</b>: der gesetzte Sollwert bleibt stehen, auch wenn Loxone ausf&auml;llt."
S6_TEXT = "Der Endpunkt liegt im unangemeldeten Bereich, damit Loxone ihn ohne Zugangsdaten erreicht. Deshalb ist er durch ein Token gesch&uuml;tzt; ohne passendes Token antwortet er mit HTTP 403. Ein neues Token macht alle bereits eingetragenen Adressen im Miniserver ung&uuml;ltig &mdash; danach m&uuml;ssen sie angepasst werden."
S6_TITEL = "Schritt 6: Das Token"
S7_TEXT = "Schweigt die Cloud, behalten die virtuellen Eing&auml;nge ihren letzten Wert &mdash; in der App sieht dann alles normal aus. Deshalb wird <span class='sm-mono'>ALTER</span> ausgewertet: es z&auml;hlt die Sekunden seit dem letzten erfolgreichen Abruf. Die Schwelle deutlich &uuml;ber den Abholtakt legen, damit ein einzelner verpasster Durchlauf keine Meldung ausl&ouml;st: bei 60 s Takt ist 300 s ein guter Wert. Nebenbei erspart <span class='sm-mono'>ALTER</span> jede Zeitrechnung &mdash; Loxone z&auml;hlt Sekunden seit dem 01.01.2009, ein Unix-Zeitstempel m&uuml;sste also erst um 1230768000 verringert werden."
S7_TITEL = "Schritt 7: Ausfallerkennung"
S8_ERLAEUTERUNG = "<b>Zu #9:</b> Die Schwelle liegt bewusst weit &uuml;ber dem Abholtakt. Bei 60 s Takt l&ouml;st ein einzelner verpasster Durchlauf sonst schon eine Meldung aus.<br><b>Zu #11 und #13:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein. Deshalb niemals mehrere Quellen direkt an seinen Eingang legen, sondern erst &uuml;ber ein ODER zusammenf&uuml;hren &mdash; sonst verschluckt eine dauerhaft aktive Quelle alle &uuml;brigen.<br><b>Zu #22 und #24:</b> Der Sollwert wird im festen Takt neu gesendet, und der Impuls wird auf den Wert addiert. Ohne diesen winzigen Wechsel sendet Loxone einen unver&auml;nderten Analogwert nicht erneut &mdash; nach einem Neustart des Speichers st&uuml;nde dort dann tagelang nichts.<br><b>Zu #25:</b> Anker kennt keinen Watchdog. F&auml;llt Loxone aus, bleibt der zuletzt gesendete Sollwert stehen. Wer das nicht will, l&auml;sst Loxone vor dem geplanten Herunterfahren einmal die Betriebsart <span class='sm-mono'>eigenverbrauch</span> senden.<br><b>Optional</b> sind #14 bis #16 (Warnung bei niedrigem Ladezustand) und #26 (Tagesbilanz)."
S8_TEXT = "Jede Zeile ist ein Baustein. Loxone Config f&uuml;hrt sie alle in der Baustein-Suche (Taste F5). Die Zeilen 1 bis 16 bauen die reine &Uuml;berwachung samt Ausfallmeldung &mdash; das gen&uuml;gt, wenn Loxone nur zusehen soll. Die Zeilen 17 bis 25 kommen dazu, wenn Loxone die Hauslast vorgeben soll; sie setzen freigegebene schreibende Befehle voraus."
S8_TITEL = "Schritt 8: Komplette Baustein-Liste zum 1:1-Nachbauen"
S9_TEXT = "Diese drei Adressen im Browser aufrufen. Antwortet die erste mit Werten, die zweite mit 403 und die dritte mit 400, dann tr&auml;gt die Einrichtung."
S9_TITEL = "Schritt 9: Gegenprobe"
