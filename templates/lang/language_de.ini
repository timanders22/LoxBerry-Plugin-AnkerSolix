; Anker SOLIX - Sprachdatei Deutsch
;
; Diese Datei wird erzeugt, nicht von Hand gepflegt. Regeln (Hausstandard):
;   - JEDER Wert steht in doppelten Anfuehrungszeichen. Bei parse_ini_file
;     beginnt mit ';' ein Kommentar - ein unquotierter Wert wuerde dort
;     abgeschnitten. Das trifft ausgerechnet jede HTML-Entitaet: &rarr;,
;     &ndash;, &uuml; enden alle auf ein Semikolon.
;   - Innerhalb eines Wertes steht KEIN weiteres doppeltes Anfuehrungszeichen.
;     HTML-Attribute deshalb einfach quoten: <span class='sm-mono'>.
;   - Werte, die im PHP durch ak_e() laufen, tragen echte Umlaute statt
;     Entitaeten - sonst stuende 'pr&amp;uuml;fen' auf dem Bildschirm.
;   - Jeder im PHP benutzte Schluessel steht in BEIDEN Sprachdateien.

