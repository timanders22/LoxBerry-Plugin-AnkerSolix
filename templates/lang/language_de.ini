[BAUSTEIN]
SO_TITEL = "So übernehmen Sie diese Seite"
B_S2 = "Virtuelle Eingänge anlegen, alle mit „In Visualisierung verwenden“: „Netzleistung (eigene Quelle)“ analog, Einheit W, Min -30000, Max 30000 (Nr. 4); Schalter „Hauslast-Regelung ein“ (Nr. 5) und „EVCC-Vorrang ein“ (Nr. 38); Taster „Eigenverbrauch“, „Smart einschalten“ und „Anker jetzt abrufen“ (Nr. 17, 20, 26); Schieberegler „Einspeisegrenze (W)“ Min 0, Max 800, Schritt 10 (Nr. 22) und „Entladegrenze (Proz)“ Min 0, Max 100, Schritt 5 (Nr. 24)."
B_S3 = "„Netzleistung (eigene Quelle)“ mit dem eigenen Stromzähler verbinden: im eigenen Projekt den Zählerwert an seine Stelle legen, also an Nr. 9 (I2) und Nr. 28 (V3) – Leistung in W, plus = Bezug, minus = Einspeisung, z. B. <span class='sm-mono'>smartmeter_0001_Total_Power_OBIS_16.7.0</span> aus dem Plugin Smartmeter. Ohne diesen Wert regelt nichts."
B_S5 = "Im Plugin, Reiter <i>%s</i>: <i>%s</i> anhaken; <i>%s</i> auf 0 lassen (Rückfall aus)."
B_S6 = "Nach dem Speichern in der App die beiden Schieberegler einmal auf ihren Startwert stellen (Einspeisegrenze 800 W, Entladegrenze 10) – Loxone sendet erst bei einer Änderung. Danach „Hauslast-Regelung ein“ einschalten."
H_TITEL = "Hinweise"
H_STATUS = "Status: die erste erfüllte Zeile gewinnt; die Zeile ohne Bedingung steht unten."
H_ODER = "Alle Störungen laufen über ODER in eine Benachrichtigung; ein Benachrichtigungsbaustein bekommt nur eine Quelle."
H_VERZ = "Die Einschaltverzögerung meldet erst, wenn die Störung anhält – kurze Aussetzer der Cloud bleiben still."
H_LEER = "Speicher fast leer schaltet unter 10&nbsp;%&nbsp;ein und über 15&nbsp;% wieder aus."
H_TASTEN = "Einspeisung freigeben und Einspeisung sperren sind Taster in der App und schicken die Befehle „Anker: Netzeinspeisung freigeben“ bzw. „… sperren“; sie wirken nur mit den Haken „Befehle über MQTT annehmen“ und „Schreibende Befehle zulassen“."
H_EINMAL = "Ein Ausgangsbefehl darf in Loxone nur einmal eingefügt werden: Netzeinspeisung freigeben und sperren stehen nur auf der Seite „AnkerSolix“, die übrigen Befehle nur auf „AnkerSolix Steuerung“. Eingänge wie ankersolix_status_ok dürfen dagegen auf beiden Seiten stehen."
H_SCHREIBBREMSE = "Schreibbremse: das Plugin nimmt ab Werk höchstens alle 10 s einen Schreibbefehl an. Deshalb wartet Nr. 12 nach dem Moduswechsel 15 s. Wird ein Schieberegler kurz nach einem Regelwert bewegt und abgewiesen (Quittung unter …/quittung), ihn noch einmal bewegen."
H_GLEICH = "Ein gleicher Wert wird erst bei einer Änderung gesendet: Loxone schickt einen Ausgangsbefehl nur, wenn sich der Wert ändert. Kommt derselbe Wert binnen 60 s doch, quittiert das Plugin ihn als angenommen, ohne die Cloud zu fragen – das hält auch den Rückfall auf."
H_RUECKFALL = "Rückfall im Plugin aus lassen (ab Werk aus): Loxone sendet nur Änderungen, ein gleichbleibender Wert löste ihn sonst aus. Anker kennt keinen Watchdog – fällt der Miniserver aus, bleibt die letzte Hauslast stehen; die Taste „Eigenverbrauch“ gibt die Regie an die Solarbank zurück."
H_PROZENT = "Prozentangaben heißen in Namen ‚(Proz)‘, weil Config ‚%‘ in ‚_‘ umwandelt – deshalb heißt der Befehl Entladegrenze setzen (Proz). Haben Sie die Steuervorlage schon früher eingelesen, heißen die zwei Befehle in Config noch ‚… (_)‘: Lesen Sie die Vorlage neu ein oder benennen Sie die Befehle um."
S1_SCHRITT1 = "Werte über MQTT einrichten: im Plugin Reiter MQTT „Werte über MQTT veröffentlichen“ (ab Werk an). Im MQTT-Gateway (Fassung 2) die Haken der Liste im Reiter MQTT setzen, bei <span class='sm-mono'>ankersolix_status_ok</span> zusätzlich „Noncached“. Der Abschnitt „%s“ oben nennt jeden Namen mit Kopierknopf."
S1_SCHRITT2 = "Eine Seite „AnkerSolix“ anlegen. Die Virtuellen Eingänge Nr. 1–6, 17–24, 31–36, 38–41 und 45 legt das Gateway mit den Namen der Tabelle an (Peripherie → Virtuelle Eingänge); auf die Seite ziehen. Nr. 30 ist eine weitere Instanz von Nr. 1. „Als Digitaleingang verwenden“ nicht anhaken; der LoxBerry-Benutzer braucht in Loxone Rechte auf jeden dieser Eingänge."
S1_SCHRITT3 = "Am Ausgang „LoxBerry MQTT-Gateway“ (Virtueller Ausgang, Adresse <span class='sm-mono'>/dev/udp/&lt;LoxBerry&gt;/11884</span>) die Befehle Nr. 16 und 29 anlegen – Befehl bei EIN wie in der Tabelle, nie „retain“ – oder die Vorlage <span class='sm-mono'>VQ_ankersolix_steuern.xml</span> einlesen (Knopf oben)."
S1_SCHRITT4 = "Zwei Virtuelle Eingänge als Taster (Nr. 15 und 28), zwei Benachrichtigungen (Nr. 9 und 14), die Konstante (Nr. 46, weitere Instanz) und die übrigen Bausteine setzen – Status, Schwellwertschalter, NICHT, ODER, UND, Einschaltverzögerung, Analogwertvalidierung, Formel und Zähler für Speicher – und die Parameter aus der Tabelle eintragen. Bei der Analogwertvalidierung (Nr. 47) den Haken bei „En“ entfernen."
S1_SCHRITT5 = "Die Leitungen nach der Spalte „Eingänge verbinden mit“ ziehen."
S1_SCHRITT6 = "Im Plugin, Reiter <i>%s</i>: <i>%s</i> anhaken, im Reiter MQTT <i>%s</i> – sonst wirken Nr. 16 und 29 nicht. Für die Prognose (Nr. 24) den Haken <i>%s</i> entfernen."
S2_SCHRITT1 = "Eine zweite Seite „AnkerSolix Steuerung“ anlegen. Die Eingänge Nr. 1–3 ein zweites Mal auf die Seite ziehen, die EVCC-Eingänge Nr. 29–31 (Plugin EVCC, Präfix ab Werk evcc2lox) als weitere Instanz von der Seite „EVCC“. Die sieben Befehle Nr. 11, 16, 19, 21, 23, 25 und 27 am Ausgang „LoxBerry MQTT-Gateway“ anlegen (oder aus <span class='sm-mono'>VQ_ankersolix_steuern.xml</span>)."
S2_SCHRITT4 = "Die übrigen Bausteine setzen – Schwellwertschalter, UND, ODER, Formel, Flankenerkennung, Ein- und Ausschaltverzögerung, Impulsgeber, Analogspeicher, Analogwertvalidierung, Konstante und Status –, die Parameter aus der Tabelle eintragen (Nr. 36: Haken bei „En“ entfernen; Nr. 37, 46 und 47: Eingang I2 negiert) und die Leitungen nach der Spalte „Eingänge verbinden mit“ ziehen. Keine Benachrichtigung: Störungen meldet die Seite „AnkerSolix“."
S2_SCHRITT7 = "EVCC-Vorrang (Nr. 29–48): ab Werk aus (Schalter Nr. 38). Nur mit dem EVCC-Plugin über MQTT und einem Ladepunkt einschalten. Lädt das Auto mindestens 60 s aus dem Netz, stellt die Seite die Solarbank auf Manuell mit Hauslast 0 W und danach zurück."
H_LEBEN = "Lebenszeichen: Nr. 45 zählt jede Minute weiter, auch wenn die Cloud schweigt. Bleibt der Wert 5 Minuten stehen, meldet Nr. 47 – dann steht der LoxBerry, das MQTT-Gateway oder der Dienst, oder MQTT ist im Plugin aus. Damit Loxone die Werte nach einem Neustart sofort hat, im Musterprojekt beim Systemstart reconnect an das Gateway senden (Seite „LoxBerry MQTT-Gateway“)."
H_MODUS = "Die Hauslast wirkt bei Solarbank 2 und 3 nur in der Betriebsart Manuell (oder Steckdosen). Deshalb schickt Nr. 11 erst „Betriebsart Manuell“, und Nr. 12 wartet 15 s – das Plugin lehnt eine Hauslast in jeder anderen Betriebsart ab und sagt warum."
H_EVCC = "EVCC-Vorrang: lädt das Auto über EVCC aus dem Netz, gibt die Solarbank ihren Speicher nicht ins Auto ab (Manuell, Hauslast 0 W). Schweigt EVCC (Nr. 36), hält nichts; ein laufendes Halten endet nach 120 s. Ob die Solarbank bei 0 W wirklich 0 W abgibt oder ihre Mindestlast, ist am Gerät ungemessen."
