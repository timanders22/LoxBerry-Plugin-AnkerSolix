THEMEN_ERKLAERUNG = "Der Dienst veröffentlicht nach jedem Abruf, das Lebenszeichen <span class='sm-mono'>status/*</span> fest jede Minute. Fehlt ein Wert in der Antwort der Cloud, geht seit 0.9.32 der Wert ohne Aussage hinaus (Spalte rechts: -1 bei Zahlen, ein Strich bei Texten) – nie eine erfundene Null, und kein alter Wert bleibt stehen. Fällt status/ok auf 0, gehen die Messwerte einmal als -1 hinaus. Die Spalte <i>retained</i> sagt, ob der Broker den letzten Wert zurückbehält: das gilt für Zustände und Einstellungen. Messwerte und das Lebenszeichen werden nie zurückbehalten. Beim Ausschalten, bei einem neuen Präfix und bei der Deinstallation räumt das Plugin die zurückbehaltenen Themen am Broker ab und liest zurück."
