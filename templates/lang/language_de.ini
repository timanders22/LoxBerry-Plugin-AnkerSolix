H_TAKT_ENERGIE = "Die Energiestatistik ist der teuerste Abruf. Anker drosselt diesen Endpunkt auf etwa zehn bis zw&ouml;lf Anfragen je Minute; danach kommt HTTP 429 zur&uuml;ck. 15 Takte sind ein ruhiger Wert."
H_VERLAUF_TAGE = "Die Messpunkte der Tagesgrafik. &Auml;ltere Dateien r&auml;umt der Dienst selbstt&auml;tig weg."
H_WARTEZEIT = "So lange wartet der Miniserver-Endpunkt auf das Ergebnis eines Befehls. Kommt in dieser Zeit nichts, meldet er <span class='sm-mono'>OK=2</span> &mdash; eingereiht, Ergebnis unbekannt. Er meldet nie einen Erfolg, den niemand gepr&uuml;ft hat."
KEINE_GERAETE = "Es sind noch keine Ger&auml;te bekannt. Das ist normal, solange der Dienst nicht gelaufen ist oder die Anmeldung nicht geklappt hat. Der Reiter Test sagt, woran es liegt."
KONTO_ERKLAERUNG = "<b>Anker SOLIX hat keine lokale Schnittstelle.</b> Weder die Solarbank noch der Smart Meter beantworten Anfragen aus dem Heimnetz; alle Werte laufen &uuml;ber die Anker-Cloud. Dieses Plugin meldet sich deshalb mit Ihren Anker-Zugangsdaten an. Die Daten liegen in einer eigenen Datei mit den Rechten 0600, nicht in der Konfiguration, die diese Seite anzeigt, und sie stehen nie in der Loxone-Projektdatei. Seit Juli 2025 darf dasselbe Konto parallel in App und auf weiteren Ger&auml;ten angemeldet sein &mdash; ein zweites Konto ist nicht mehr n&ouml;tig."
