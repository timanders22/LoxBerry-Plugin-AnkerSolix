DIENST_ERKLAERUNG = "Der Dienst holt die Werte im eingestellten Takt aus der Anker-Cloud und legt sie ab. Oberfläche und Miniserver lesen nur diesen Zwischenspeicher — sie sprechen selbst nie mit der Cloud. Ein minutlicher Wächter startet den Dienst neu, wenn er abstürzt; ein von Hand angehaltener Dienst bleibt angehalten."
