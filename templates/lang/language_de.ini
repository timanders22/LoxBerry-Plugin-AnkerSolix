B_HAUSLAST_MODUS = "<b>Die Hauslast wirkt bei Solarbank 2 und 3 nur in der Betriebsart Manuell (oder Steckdosen).</b> Erst „modus manuell“, dann die Hauslast – das Plugin lehnt sonst ab und sagt warum (Quittung „abgelehnt: MODUS_1: …“)."
