UMFANG_ERKLAERUNG = "Die Anker-Cloud drosselt: die Energiestatistik verträgt etwa zehn bis zwölf Abfragen je Minute, danach antwortet sie mit <b>HTTP 429</b> — und die Sperre trifft dann auch die Messwerte. Wer eine Abfrage nicht braucht, schaltet sie hier ab. Das ist die wirksamste Bremse, die es hier gibt."
