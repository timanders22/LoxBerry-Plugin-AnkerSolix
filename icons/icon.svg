<?xml version="1.0" encoding="utf-8"?>
<!-- Anker SOLIX - Plugin-Symbol.
     Hausstandard: runde Scheibe in LoxBerry-Gruen #6dac20, Motiv am echten
     Geraet orientiert. Die Solarbank ist ein aufrecht stehender, schmaler
     Quader mit stark abgerundeten Kanten und einem Bedienfeld oben.
     Bewusst KEINE fremden Wortmarken oder Logos, auch nicht angedeutet. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <circle cx="256" cy="256" r="256" fill="#6dac20"/>

  <!-- Speicherturm -->
  <rect x="176" y="118" width="160" height="288" rx="34" ry="34"
        fill="#ffffff" opacity="0.96"/>
  <rect x="176" y="118" width="160" height="288" rx="34" ry="34"
        fill="none" stroke="#3d6412" stroke-width="10"/>

  <!-- Fuellstand: unterer Teil gefuellt -->
  <path d="M186 262 h140 v110 a24 24 0 0 1 -24 24 h-92 a24 24 0 0 1 -24 -24 z"
        fill="#6dac20" opacity="0.55"/>

  <!-- Bedienfeld -->
  <rect x="206" y="150" width="100" height="16" rx="8" ry="8" fill="#3d6412"/>
  <circle cx="256" cy="196" r="13" fill="#3d6412"/>

  <!-- Trennfuge zwischen Ober- und Unterteil -->
  <line x1="186" y1="262" x2="326" y2="262" stroke="#3d6412" stroke-width="7"/>

  <!-- Blitz als Sinnbild fuer die Energieabgabe -->
  <path d="M268 288 l-40 62 h30 l-14 52 46 -70 h-30 z" fill="#ffffff"
        stroke="#3d6412" stroke-width="7" stroke-linejoin="round"/>

  <!-- Standfuesse -->
  <rect x="196" y="406" width="34" height="16" rx="6" ry="6" fill="#3d6412"/>
  <rect x="282" y="406" width="34" height="16" rx="6" ry="6" fill="#3d6412"/>
</svg>
