[AUTOUPDATE]
# Diese Datei liegt im Wurzelverzeichnis des GitHub-Repositories und steuert
# das Auto-Update. Sechs Stellen tragen dieselbe Nummer: plugin.cfg,
# release.cfg (hier), prerelease.cfg, der Tag, das Archiv und die
# Release-Seite.
#
# ACHTUNG, Reihenfolge - AUTOMATIC_UPDATES steht auf true:
# LoxBerry liest DIESE Datei aus dem Zweig, zieht das Archiv aber aus dem TAG.
# Wer hier zuerst hochsetzt und den Tag danach anlegt, hinterlaesst genau in
# dieser Luecke eine Fassung, die jede Anlage sehen will und keine laden kann.
# Deshalb: erst Inhalt schieben, dann Tag, dann Release, dann NACHMESSEN, dass
# das Archiv mit 200 antwortet - und ERST DANN diese Datei hochsetzen.
#
# Diese Datei bleibt auf der VEROEFFENTLICHTEN Nummer stehen, auch wenn im
# Arbeitsordner laengst eine hoehere Fassung fertig liegt - welche, sagt die
# plugin.cfg. Das ist KEIN Versehen, sondern der Zustand, in dem eine
# vorbereitete Fassung liegen soll.
#
# Hier standen bis 11.09.2026 feste Zahlen (0.9.7 vorbereitet, 0.9.6
# veroeffentlicht). Beide waren seit sieben Fassungen falsch: ein Kommentar,
# der eine Fassungsnummer nennt, veraltet beim naechsten Mal wieder.

VERSION=0.9.15
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-AnkerSolix/archive/refs/tags/v0.9.15.zip
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-AnkerSolix/releases/tag/v0.9.15
