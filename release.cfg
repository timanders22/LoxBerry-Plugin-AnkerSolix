[AUTOUPDATE]
# Diese Datei liegt im Wurzelverzeichnis des GitHub-Repositories und steuert
# das Auto-Update. Sechs Stellen tragen dieselbe Nummer: plugin.cfg,
# release.cfg (hier), prerelease.cfg, der Tag, das Archiv und die
# Release-Seite.
#
# ACHTUNG, Reihenfolge - AUTOMATIC_UPDATES steht auf true:
# LoxBerry liest DIESE Datei aus dem Zweig, zieht das Archiv aber aus dem TAG.
# Wer hier zuerst hochsetzt und den Tag danach anlegt, hinterlaesst genau in
# dieser Luecke eine Fassung, die jede Anlage sehen will und keine laden kann.
# Deshalb: erst Inhalt schieben, dann Tag, dann Release, dann NACHMESSEN, dass
# das Archiv mit 200 antwortet - und ERST DANN diese Datei hochsetzen.
#
# Im Arbeitsordner liegt 0.9.7 fertig vorbereitet (siehe plugin.cfg). Dass
# hier weiterhin 0.9.6 steht, ist KEIN Versehen, sondern der Zustand, in dem
# eine vorbereitete Fassung liegen soll.

VERSION=0.9.7
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-AnkerSolix/archive/refs/tags/v0.9.7.zip
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-AnkerSolix/releases/tag/v0.9.7
